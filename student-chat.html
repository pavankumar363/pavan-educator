<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="assets/pavan-logo.svg"><title>Pavan Educator | Student Chat</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}.sidebar{position:fixed;inset:0 auto 0 0;width:295px;background:#071a33;color:#fff;padding:30px 25px;display:flex;flex-direction:column}.logo{font-size:30px;font-weight:800;padding:5px 5px 55px}.logo span{color:#2474ff}.panel-title{color:#aeb9cb;font-size:17px;font-weight:700;margin-bottom:25px}.menu{list-style:none}.menu li{margin-bottom:18px}.menu a{display:flex;align-items:center;gap:15px;padding:16px 18px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:17px}.menu a:hover,.menu a.active{background:#2474ff}.menu-icon{width:25px;text-align:center;font-size:23px}.logout{margin-top:auto}.logout a{display:block;background:#142b4a;color:#ff6868;padding:16px 18px;border-radius:10px;text-decoration:none;font-weight:700}.main{margin-left:295px;min-height:100vh}.topbar{height:105px;background:#fff;border-bottom:1px solid #e4e9f1;display:flex;align-items:center;justify-content:space-between;padding:0 45px}.topbar h1{font-size:30px}.user-top{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}.user-icon{width:45px;height:45px;border-radius:50%;background:#2474ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px}.content{padding:35px;max-width:1100px}.chat-card{background:#fff;border:1px solid #dfe7f2;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(20,40,80,.06)}.chat-head{padding:24px 28px;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between;align-items:center}.chat-head h2{font-size:25px}.chat-head p{color:#64748b;margin-top:6px}.online{font-weight:700;color:#16a34a}.messages{height:480px;overflow-y:auto;padding:25px;background:#f5f8fc}.msg{max-width:75%;margin-bottom:18px}.msg.mine{margin-left:auto;text-align:right}.bubble{display:inline-block;text-align:left;padding:12px 16px;border-radius:16px;background:#fff;border:1px solid #e1e7ef;line-height:1.45;word-break:break-word}.mine .bubble{background:#2474ff;color:#fff;border-color:#2474ff}.meta{font-size:12px;color:#7a8799;margin:5px 6px}.mine .meta{color:#64748b}.empty{text-align:center;color:#7a8799;padding:100px 20px}.composer{display:flex;gap:12px;padding:18px;border-top:1px solid #e5eaf2;background:#fff}.composer input{flex:1;padding:15px 17px;border:1px solid #ccd6e4;border-radius:12px;font-size:16px;outline:none}.composer input:focus{border-color:#2474ff}.composer button{border:0;background:#2474ff;color:#fff;padding:0 28px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.composer button:disabled{opacity:.6;cursor:not-allowed}.status{text-align:center;font-size:13px;color:#7a8799;padding:0 18px 15px}.footer{text-align:center;color:#69758a;font-size:15px;padding:30px}@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto}.logo{padding-bottom:25px}.main{margin-left:0}.topbar{height:80px;padding:0 20px}.topbar h1{font-size:23px}.content{padding:15px}.messages{height:55vh}.msg{max-width:88%}.composer button{padding:0 18px}}
</style></head><body><aside class="sidebar"><div class="logo">Pavan <span>Educator</span></div><div class="panel-title">STUDENT PANEL</div><ul class="menu"><li><a href="student-dashboard.html"><span class="menu-icon">🏠</span>Dashboard</a></li><li><a href="student-chat.html" class="active"><span class="menu-icon">💬</span>Chat with Students</a></li><li><a href="student-projects.html"><span class="menu-icon">💻</span>My Projects</a></li><li><a href="student-profile.html"><span class="menu-icon">👤</span>My Profile</a></li></ul><div class="logout"><a href="login.html" onclick="logout()">🚪 Logout</a></div></aside><main class="main"><header class="topbar"><h1>Student Chat</h1><div class="user-top"><div class="user-icon">👤</div><span id="topName">Student</span></div></header><div class="content"><section class="chat-card"><div class="chat-head"><div><h2>💬 Chat with Other Students</h2><p>Send messages to everyone in the student group.</p></div><div class="online">● Live Chat</div></div><div id="messages" class="messages"><div class="empty">Loading chat...</div></div><div class="composer"><input id="messageInput" maxlength="500" placeholder="Type your message..." autocomplete="off"><button id="sendBtn">Send</button></div><div id="status" class="status">Connecting...</div></section><footer class="footer">© 2026 Pavan Educator. All rights reserved.</footer></div></main><script src="data/demo-students.js?v=20260902c"></script><script src="data/demo-auth.js?v=20260902c"></script><script>const SUPABASE_URL='https://jlrmmkgcjckkayearlca.supabase.co';const SUPABASE_KEY='sb_publishable_jlrmmkgcjckkayearlca_demo';let student=null;let pollTimer=null;let lastId=0;async function api(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(rows){const box=document.getElementById('messages');if(!rows.length){box.innerHTML='<div class="empty">No messages yet. Be the first to say hello! 👋</div>';return}box.innerHTML=rows.map(m=>{const mine=m.username.toLowerCase()===student.username.toLowerCase();const d=new Date(m.created_at);return '<div class="msg '+(mine?'mine':'')+'"><div class="meta"><b>'+esc(m.student_name)+'</b> · '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div><div class="bubble">'+esc(m.message)+'</div></div>'}).join('');box.scrollTop=box.scrollHeight;lastId=rows[rows.length-1].id}async function load(){try{const rows=await api('student_chat_messages?select=id,username,student_name,message,created_at&order=id.asc&limit=200');render(rows);document.getElementById('status').textContent='Connected • messages update automatically'}catch(e){document.getElementById('status').textContent='Chat connection error';console.error(e)}}async function refresh(){try{const rows=await api('student_chat_messages?select=id,username,student_name,message,created_at&id=gt.'+lastId+'&order=id.asc&limit=100');if(rows.length){const all=await api('student_chat_messages?select=id,username,student_name,message,created_at&order=id.asc&limit=200');render(all)}}catch(e){console.error(e)}}async function send(){const input=document.getElementById('messageInput'),btn=document.getElementById('sendBtn'),message=input.value.trim();if(!message)return;btn.disabled=true;try{await api('student_chat_messages',{method:'POST',body:JSON.stringify({username:student.username,student_name:student.name,message})});input.value='';await refresh()}catch(e){alert('Unable to send message. Please try again.');console.error(e)}finally{btn.disabled=false;input.focus()}}function logout(){if(window.PavanDemoAuth)PavanDemoAuth.logout()}async function init(){student=window.PavanDemoAuth&&PavanDemoAuth.current();if(!student){location.href='login.html';return}document.getElementById('topName').textContent=student.name;await load();pollTimer=setInterval(refresh,3000);document.getElementById('sendBtn').onclick=send;document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()})}init();</script></body></html>
