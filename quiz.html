<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | Quizzes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:30px}.top{background:linear-gradient(110deg,#126df3,#5645f4);color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px}.top h1{margin:0 0 8px}.top p{margin:0;opacity:.9}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.back{color:#2474ff;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e0e7f2;border-radius:15px;padding:22px}.card h2,.card h3{margin-top:0}.meta{color:#718096;font-size:13px;margin:10px 0 18px}.btn{display:inline-block;border:0;border-radius:9px;background:#2474ff;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.empty{text-align:center;padding:50px;color:#718096;background:#fff;border:1px solid #e0e7f2;border-radius:15px}.quizbox{display:none}.question{background:#fff;border:1px solid #e0e7f2;border-radius:15px;padding:25px}.option{display:block;border:1px solid #dbe3ef;border-radius:10px;padding:14px;margin:10px 0;cursor:pointer}.option input{margin-right:10px}.nav{display:flex;justify-content:space-between;margin-top:18px}.timer{font-weight:800;color:#d83a3a}.result{text-align:center}.score{font-size:46px;font-weight:800;color:#2474ff}.rank{margin-top:8px;color:#52627a}@media(max-width:600px){.wrap{padding:18px}.top{padding:23px}.question{padding:18px}}
</style></head><body><main class="wrap">
<div class="top"><h1>📝 Pavan Educator Quiz</h1><p>Choose a published quiz, test yourself and see your result.</p></div>
<div id="listView"><div class="bar"><h2>Available Quizzes</h2><a class="back" href="student-dashboard.html">← Dashboard</a></div><div id="quizList" class="grid"></div></div>
<div id="quizView" class="quizbox"><div class="bar"><h2 id="quizTitle"></h2><div class="timer" id="timer"></div></div><div id="questionArea"></div><div class="nav"><button class="btn" id="prevBtn">← Previous</button><button class="btn" id="nextBtn">Next →</button></div></div>
<div id="resultView" class="quizbox card result"><h2>Quiz Completed</h2><div class="score" id="scoreText"></div><div id="rankText" class="rank"></div><p id="resultMessage"></p><a class="btn" href="quiz.html">Back to Quizzes</a></div>
</main>
<script>
const URL='https://jlrmmkgcjckkayearlca.supabase.co',KEY='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';
let quizzes=[],questions=[],answers={},current=0,startedAt=0,timerHandle=null,activeQuiz=null;
function headers(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}};
async function api(path,opts={}){const r=await fetch(URL+'/rest/v1/'+path,{headers:headers(),...opts});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function load(){try{const s=JSON.parse(sessionStorage.getItem('pavanDemoStudent')||'null');if(!s){location.href='login.html';return}quizzes=await api('quizzes?published=eq.true&select=*&order=created_at.desc');const box=document.getElementById('quizList');if(!quizzes.length){box.innerHTML='<div class="empty">No published quizzes are available yet.</div>';return}box.innerHTML=quizzes.map(q=>'<article class="card"><h3>'+esc(q.title)+'</h3><p>'+esc(q.description||'No description')+'</p><div class="meta">⏱ '+q.duration_minutes+' minutes</div><button class="btn" onclick="startQuiz('+q.id+')">Start Quiz</button></article>').join('')}catch(e){document.getElementById('quizList').innerHTML='<div class="empty">Quiz service is unavailable. Please try again.</div>';console.error(e)}}
async function startQuiz(id){activeQuiz=quizzes.find(q=>q.id===id);questions=await api('quiz_questions?quiz_id=eq.'+id+'&select=*&order=question_no.asc');if(!questions.length)return alert('This quiz has no questions yet.');answers={};current=0;startedAt=Date.now();document.getElementById('listView').style.display='none';document.getElementById('quizView').style.display='block';render();timerHandle=setInterval(tick,1000);tick()}
function tick(){const left=Math.max(0,activeQuiz.duration_minutes*60-Math.floor((Date.now()-startedAt)/1000));document.getElementById('timer').textContent='Time: '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left===0)finish()}
function render(){const q=questions[current],chosen=answers[q.id]||'';document.getElementById('quizTitle').textContent=activeQuiz.title+' — '+(current+1)+'/'+questions.length;document.getElementById('questionArea').innerHTML='<div class="question"><h3>Q'+q.question_no+'. '+esc(q.question_text)+'</h3>'+['A','B','C','D'].map(x=>'<label class="option"><input type="radio" name="answer" value="'+x+'" '+(chosen===x?'checked':'')+' onchange="answers['+q.id+']=this.value"> <b>'+x+'.</b> '+esc(q['option_'+x.toLowerCase()])+'</label>').join('')+'</div>';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').textContent=current===questions.length-1?'Submit Quiz':'Next →'}
document.getElementById('prevBtn').onclick=()=>{if(current>0){current--;render()}};document.getElementById('nextBtn').onclick=()=>{if(current<questions.length-1){current++;render()}else finish()};
async function finish(){if(!activeQuiz)return;clearInterval(timerHandle);const student=JSON.parse(sessionStorage.getItem('pavanDemoStudent')||'null');let score=0,total=0;questions.forEach(q=>{total+=q.marks||1;if(answers[q.id]===q.correct_option)score+=q.marks||1});const time=Math.floor((Date.now()-startedAt)/1000);try{await api('quiz_attempts',{method:'POST',headers:{...headers(),'Prefer':'return=minimal'},body:JSON.stringify({quiz_id:activeQuiz.id,username:student.username,score,total_marks:total,time_seconds:time})});const rows=await api('quiz_attempts?quiz_id=eq.'+activeQuiz.id+'&select=*&order=score.desc,time_seconds.asc');const rank=rows.findIndex(x=>x.username===student.username&&x.submitted_at===rows.find(y=>y.username===student.username)?.submitted_at)+1;document.getElementById('scoreText').textContent=score+' / '+total;document.getElementById('rankText').textContent='Your current ranking: '+(rank||'—');document.getElementById('resultMessage').textContent='Time used: '+Math.floor(time/60)+'m '+time%60+'s';document.getElementById('quizView').style.display='none';document.getElementById('resultView').style.display='block'}catch(e){alert('Could not save the result. Please try again.');console.error(e)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script></body></html>
