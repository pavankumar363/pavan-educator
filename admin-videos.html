<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pavan Educator | Manage Videos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fc;
    color: #172033;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;
    background: #111a2e;
    color: white;
    padding: 25px 18px;
}

.logo {
    padding: 10px 12px 30px;
    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #4d8dff;
}

.admin-label {
    color: #8e9bb3;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 0 12px 12px;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 7px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 14px;
    color: #c9d2e3;
    text-decoration: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
}

.menu a:hover,
.menu a.active {
    background: #2563eb;
    color: white;
}

.menu-icon {
    width: 24px;
    text-align: center;
}

.logout {
    position: absolute;
    bottom: 25px;
    left: 18px;
    right: 18px;
}

.logout a {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 9px;
    background: #1c2944;
    color: #c9d2e3;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

.logout a:hover {
    background: #dc3545;
    color: white;
}

/* MAIN */

.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    height: 75px;
    background: white;
    border-bottom: 1px solid #e2e8f2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
}

.page-title h1 {
    font-size: 23px;
}

.page-title p {
    color: #7a869b;
    font-size: 13px;
    margin-top: 4px;
}

.back-link {
    text-decoration: none;
    color: #2563eb;
    font-weight: 700;
    font-size: 14px;
}

.content {
    padding: 35px;
}

/* HEADER */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h2 {
    font-size: 28px;
}

.page-header p {
    color: #7a869b;
    margin-top: 6px;
    font-size: 14px;
}

.add-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 13px 20px;
    border-radius: 9px;
    font-weight: 700;
    cursor: pointer;
}

.add-btn:hover {
    background: #1d4ed8;
}

/* SEARCH */

.search-box {
    width: 100%;
    height: 52px;
    background: white;
    border: 1px solid #dce4f0;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    outline: none;
    margin-bottom: 25px;
}

.search-box:focus {
    border-color: #2563eb;
}

/* VIDEO GRID */

.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.video-card {
    background: white;
    border: 1px solid #e1e7f2;
    border-radius: 15px;
    overflow: hidden;
    transition: .2s;
}

.video-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 35px rgba(30,70,140,.08);
}

.video-thumbnail {
    height: 160px;
    background: linear-gradient(135deg,#e9f0ff,#f7faff);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.play-icon {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    padding-left: 4px;
}

.duration {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: rgba(0,0,0,.75);
    color: white;
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 11px;
}

.video-info {
    padding: 22px;
}

.video-category {
    color: #2563eb;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

.video-info h3 {
    margin: 10px 0;
    font-size: 20px;
}

.video-info p {
    color: #687389;
    font-size: 13px;
    line-height: 1.6;
}

.video-actions {
    display: flex;
    gap: 9px;
    margin-top: 18px;
}

.watch-btn,
.edit-btn,
.delete-btn {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
}

.watch-btn {
    background: #2563eb;
    color: white;
}

.edit-btn {
    background: #eaf1ff;
    color: #2563eb;
}

.delete-btn {
    background: #fff0f0;
    color: #dc3545;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,40,.55);
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 23px;
}

.close-btn {
    border: none;
    background: #f0f3f8;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #d5deec;
    border-radius: 8px;
    padding: 12px;
    font-family: inherit;
    outline: none;
}

.form-group textarea {
    height: 90px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #2563eb;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.cancel-btn,
.save-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
}

.cancel-btn {
    border: 1px solid #d5deec;
    background: white;
    color: #687389;
}

.save-btn {
    border: none;
    background: #2563eb;
    color: white;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px solid #e1e7f2;
    border-radius: 15px;
    padding: 50px;
    text-align: center;
    color: #7a869b;
    grid-column: 1 / -1;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

/* MOBILE */

@media(max-width:1000px) {

    .sidebar {
        width: 210px;
    }

    .main {
        margin-left: 210px;
    }

    .video-grid {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:700px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .logout {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        margin-top: 20px;
    }

    .topbar {
        padding: 0 20px;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        Pavan <span>Educator</span>
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

    <ul class="menu">

        <li>
            <a href="admin-dashboard.html">
                <span class="menu-icon">🏠</span>
                Dashboard
            </a>
        </li>

        <li>
            <a href="admin-courses.html">
                <span class="menu-icon">📚</span>
                Courses
            </a>
        </li>

        <li>
            <a href="admin-projects.html">
                <span class="menu-icon">💻</span>
                Projects
            </a>
        </li>

        <li>
            <a href="admin-videos.html" class="active">
                <span class="menu-icon">🎥</span>
                Videos
            </a>
        </li>

        <li>
            <a href="admin-students.html">
                <span class="menu-icon">🎓</span>
                Students
            </a>
        </li>

        <li>
            <a href="admin-settings.html">
                <span class="menu-icon">⚙️</span>
                Settings
            </a>
        </li>

    </ul>

    <div class="logout">

        <a href="login.html" onclick="logout()">
            🚪 Logout
        </a>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

        <div class="page-title">

            <h1>
                Video Management
            </h1>

            <p>
                Add and manage educational videos
            </p>

        </div>

        <a
            href="admin-dashboard.html"
            class="back-link"
        >
            ← Dashboard
        </a>

    </header>


    <!-- CONTENT -->

    <div class="content">


        <div class="page-header">

            <div>

                <h2>
                    Videos
                </h2>

                <p>
                    Create, edit and remove educational videos.
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + Add Video
            </button>

        </div>


        <!-- SEARCH -->

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search videos..."
            onkeyup="renderVideos()"
        >


        <!-- VIDEO GRID -->

        <div
            class="video-grid"
            id="videoGrid"
        ></div>


    </div>

</main>


<!-- MODAL -->

<div
    class="modal"
    id="videoModal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Video
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form onsubmit="saveVideo(event)">


            <div class="form-group">

                <label>
                    Video Title
                </label>

                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Example: Java Programming Basics"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select id="videoCategory">

                    <option>
                        Programming
                    </option>

                    <option>
                        Web Development
                    </option>

                    <option>
                        Database
                    </option>

                    <option>
                        Project
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="videoDescription"
                    placeholder="Enter video description..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    YouTube / Video Link
                </label>

                <input
                    type="url"
                    id="videoLink"
                    placeholder="https://www.youtube.com/watch?v=..."
                >

            </div>


            <div class="form-group">

                <label>
                    Duration
                </label>

                <input
                    type="text"
                    id="videoDuration"
                    placeholder="Example: 12:30"
                >

            </div>


            <div class="form-group">

                <label>
                    Icon / Emoji
                </label>

                <input
                    type="text"
                    id="videoIcon"
                    placeholder="▶️"
                    maxlength="4"
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Video
                </button>

            </div>


        </form>

    </div>

</div>


<script>

/* ================= DEFAULT VIDEOS ================= */

const defaultVideos = [

    {
        title:
            "Java Programming Basics",

        category:
            "Programming",

        description:
            "Learn the fundamentals of Java programming step by step.",

        link:
            "",

        duration:
            "12:30",

        icon:
            "☕"
    },


    {
        title:
            "HTML & CSS Basics",

        category:
            "Web Development",

        description:
            "Learn how to create your first professional webpage.",

        link:
            "",

        duration:
            "15:20",

        icon:
            "🌐"
    },


    {
        title:
            "JavaScript Introduction",

        category:
            "Web Development",

        description:
            "Understand JavaScript basics and make websites interactive.",

        link:
            "",

        duration:
            "18:45",

        icon:
            "⚡"
    },


    {
        title:
            "Python Programming",

        category:
            "Programming",

        description:
            "Start learning Python programming with simple examples.",

        link:
            "",

        duration:
            "20:10",

        icon:
            "🐍"
    },


    {
        title:
            "MySQL Database Basics",

        category:
            "Database",

        description:
            "Learn databases, tables and basic SQL queries.",

        link:
            "",

        duration:
            "16:35",

        icon:
            "🗄️"
    },


    {
        title:
            "Build Your First Website",

        category:
            "Project",

        description:
            "Follow a practical project and build a website from scratch.",

        link:
            "",

        duration:
            "25:00",

        icon:
            "🚀"
    }

];


/* ================= LOAD ================= */

let videos =
    JSON.parse(
        localStorage.getItem(
            "pavanVideos"
        )
    );


if (
    !videos ||
    videos.length === 0
) {

    videos =
        defaultVideos;

    saveVideos();

}


let editingIndex = -1;


/* ================= SAVE ================= */

function saveVideos() {

    localStorage.setItem(
        "pavanVideos",
        JSON.stringify(videos)
    );

}


/* ================= RENDER ================= */

function renderVideos() {


    const grid =
        document.getElementById(
            "videoGrid"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    grid.innerHTML = "";


    const filtered =
        videos.filter(
            function(video) {

                return (

                    video.title
                    .toLowerCase()
                    .includes(search)

                    ||

                    video.category
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    if (
        filtered.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🎥
                </div>

                <h3>
                    No videos found
                </h3>

                <p>
                    Try another search or add a new video.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(video) {


            const realIndex =
                videos.indexOf(video);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "video-card";


            let watchHTML = "";


            if (
                video.link
            ) {

                watchHTML = `

                    <a
                        href="${escapeAttribute(video.link)}"
                        target="_blank"
                        class="watch-btn"
                    >
                        ▶ Watch
                    </a>

                `;

            }

            else {

                watchHTML = `

                    <button
                        class="watch-btn"
                        onclick="noVideoLink()"
                    >
                        ▶ Watch
                    </button>

                `;

            }


            card.innerHTML = `

                <div class="video-thumbnail">

                    <div class="play-icon">
                        ${video.icon || "▶️"}
                    </div>

                    <div class="duration">
                        ${escapeHTML(
                            video.duration || "--:--"
                        )}
                    </div>

                </div>


                <div class="video-info">


                    <div class="video-category">
                        ${escapeHTML(
                            video.category
                        )}
                    </div>


                    <h3>
                        ${escapeHTML(
                            video.title
                        )}
                    </h3>


                    <p>
                        ${escapeHTML(
                            video.description
                        )}
                    </p>


                    <div class="video-actions">

                        ${watchHTML}


                        <button
                            class="edit-btn"
                            onclick="editVideo(${realIndex})"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteVideo(${realIndex})"
                        >
                            🗑️ Delete
                        </button>

                    </div>


                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* ================= ADD ================= */

function openAddModal() {


    editingIndex = -1;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Video";


    document.getElementById(
        "videoTitle"
    ).value = "";


    document.getElementById(
        "videoCategory"
    ).value =
        "Programming";


    document.getElementById(
        "videoDescription"
    ).value = "";


    document.getElementById(
        "videoLink"
    ).value = "";


    document.getElementById(
        "videoDuration"
    ).value = "";


    document.getElementById(
        "videoIcon"
    ).value = "";


    document.getElementById(
        "videoModal"
    ).classList.add("show");

}


/* ================= EDIT ================= */

function editVideo(index) {


    const video =
        videos[index];


    editingIndex = index;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Video";


    document.getElementById(
        "videoTitle"
    ).value =
        video.title;


    document.getElementById(
        "videoCategory"
    ).value =
        video.category;


    document.getElementById(
        "videoDescription"
    ).value =
        video.description;


    document.getElementById(
        "videoLink"
    ).value =
        video.link;


    document.getElementById(
        "videoDuration"
    ).value =
        video.duration;


    document.getElementById(
        "videoIcon"
    ).value =
        video.icon;


    document.getElementById(
        "videoModal"
    ).classList.add("show");

}


/* ================= SAVE ================= */

function saveVideo(event) {


    event.preventDefault();


    const video = {


        title:
            document.getElementById(
                "videoTitle"
            ).value.trim(),


        category:
            document.getElementById(
                "videoCategory"
            ).value,


        description:
            document.getElementById(
                "videoDescription"
            ).value.trim(),


        link:
            document.getElementById(
                "videoLink"
            ).value.trim(),


        duration:
            document.getElementById(
                "videoDuration"
            ).value.trim(),


        icon:
            document.getElementById(
                "videoIcon"
            ).value.trim()
            || "▶️"

    };


    const wasEditing =
        editingIndex !== -1;


    if (
        editingIndex === -1
    ) {

        videos.push(video);

    }

    else {

        videos[
            editingIndex
        ] = video;

    }


    saveVideos();

    closeModal();

    renderVideos();


    alert(
        wasEditing
        ? "Video updated successfully!"
        : "Video added successfully!"
    );

}


/* ================= DELETE ================= */

function deleteVideo(index) {


    const video =
        videos[index];


    const confirmed =
        confirm(
            'Delete "' +
            video.title +
            '"?'
        );


    if (!confirmed) {

        return;

    }


    videos.splice(
        index,
        1
    );


    saveVideos();

    renderVideos();


    alert(
        "Video deleted successfully!"
    );

}


/* ================= CLOSE ================= */

function closeModal() {

    document.getElementById(
        "videoModal"
    )
    .classList
    .remove("show");

}


/* ================= NO LINK ================= */

function noVideoLink() {

    alert(
        "No video link has been added yet."
    );

}


/* ================= ESCAPE ================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value;

    return div.innerHTML;

}


function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* ================= LOGOUT ================= */

function logout() {

    sessionStorage.removeItem(
        "currentRole"
    );

    sessionStorage.removeItem(
        "currentUser"
    );

}


/* ================= INITIAL LOAD ================= */

renderVideos();

</script>

</body>
</html>
