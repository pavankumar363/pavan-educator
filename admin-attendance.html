<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | Attendance Entry</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}.wrap{max-width:1000px;margin:35px auto;padding:20px}.card{background:#fff;border:1px solid #e1e7f2;border-radius:18px;padding:28px;box-shadow:0 8px 25px rgba(30,70,140,.06)}h1{margin:0 0 6px}.sub{color:#718096;margin:0 0 25px}.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:9px;font-size:14px}.actions{display:flex;gap:10px;margin:22px 0}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.save{background:#2563eb;color:#fff}.back{background:#e9eef7;color:#172033}.msg{padding:12px;border-radius:9px;background:#eef7ee;color:#176b35;display:none;margin-bottom:18px}.table{overflow:auto;border:1px solid #e1e7f2;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;font-size:13px}th{background:#f7f9fd;font-size:11px;color:#687389}.present{color:#16834b;font-weight:700}.absent{color:#b42318;font-weight:700}@media(max-width:750px){.form{grid-template-columns:1fr}.wrap{margin:15px auto;padding:10px}}
</style><style id="attendance-upgrade">.att-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.att-stat{background:#f7fbff;border:1px solid #dceaf6;border-radius:14px;padding:15px}.att-stat b{font-size:23px;color:#123968}.att-stat small{display:block;color:#71879a;margin-top:4px}.att-tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.att-tools input,.att-tools select{padding:10px;border:1px solid #cfe0ee;border-radius:9px;background:#fff}@media(max-width:760px){.att-summary{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="card"><h1>📋 Attendance Entry</h1><p class="sub">Record attendance for a student. The saved record will appear in the student's profile.</p><div id="msg" class="msg"></div><div class="att-summary"><div class="att-stat"><b id="attTotal">0</b><small>Total Records</small></div><div class="att-stat"><b id="attPresent">0</b><small>Present</small></div><div class="att-stat"><b id="attAbsent">0</b><small>Absent</small></div><div class="att-stat"><b id="attRate">0%</b><small>Attendance Rate</small></div></div><div class="att-tools"><input id="attSearch" placeholder="Search student or subject" oninput="filterAttendance()"><select id="attStatusFilter" onchange="filterAttendance()"><option value="">All Status</option><option>Present</option><option>Absent</option></select></div><div class="form"><div class="field"><label>Student</label><select id="student"></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Subject</label><input id="subject" placeholder="e.g. Mathematics"></div><div class="field"><label>Status</label><select id="status"><option>Present</option><option>Absent</option></select></div></div><div class="actions"><button class="btn save" onclick="save()">Save Attendance</button><button class="btn back" onclick="location.href='admin-dashboard.html'">← Dashboard</button></div><div class="table"><table><thead><tr><th>DATE</th><th>STUDENT</th><th>SUBJECT</th><th>STATUS</th></tr></thead><tbody id="recent"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main>
<script src="data/demo-students.js?v=20260911b"></script><script>
const URL='https://jlrmmkgcjckkayearlca.supabase.co',KEY='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';
function guard(){if(sessionStorage.getItem('adminLoggedIn')!=='true'||sessionStorage.getItem('currentRole')!=='Admin'){location.href='login.html';return false}return true}
async function api(path,opt={}){const r=await fetch(URL+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Accept:'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());const text=await r.text();return text?JSON.parse(text):null}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
let attendanceRows=[];
async function load(){try{attendanceRows=await api('student_attendance?select=attendance_date,username,subject,status&order=attendance_date.desc&limit=1000');const present=attendanceRows.filter(r=>String(r.status).toLowerCase()==='present').length;const absent=attendanceRows.filter(r=>String(r.status).toLowerCase()==='absent').length;document.getElementById('attTotal').textContent=attendanceRows.length;document.getElementById('attPresent').textContent=present;document.getElementById('attAbsent').textContent=absent;document.getElementById('attRate').textContent=(attendanceRows.length?Math.round(present/attendanceRows.length*100):0)+'%';filterAttendance()}catch(e){document.getElementById('recent').innerHTML='<tr><td colspan="4">Unable to load attendance.</td></tr>';console.error(e)}}
function filterAttendance(){const q=(document.getElementById('attSearch')?.value||'').toLowerCase();const sf=document.getElementById('attStatusFilter')?.value||'';const map=new Map((window.PAVAN_DEMO_STUDENTS||[]).map(s=>[String(s.username).toLowerCase(),s.name]));const rows=attendanceRows.filter(r=>{const name=map.get(String(r.username).toLowerCase())||r.username;return(!q||[name,r.username,r.subject,r.attendance_date].some(v=>String(v).toLowerCase().includes(q)))&&(!sf||r.status===sf)});document.getElementById('recent').innerHTML=rows.length?rows.slice(0,300).map(r=>'<tr><td>'+esc(r.attendance_date)+'</td><td>'+esc(map.get(String(r.username).toLowerCase())||r.username)+'</td><td>'+esc(r.subject)+'</td><td class="'+(r.status==='Present'?'present':'absent')+'">'+esc(r.status)+'</td></tr>').join(''):'<tr><td colspan="4">No matching attendance records.</td></tr>'}
async function save(){const s=document.getElementById('student').value,d=document.getElementById('date').value,sub=document.getElementById('subject').value.trim(),st=document.getElementById('status').value;if(!s||!d||!sub){alert('Please select a student, date and subject.');return}const btn=document.querySelector('.save');btn.disabled=true;btn.textContent='Saving...';try{await api('student_attendance',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({username:s,attendance_date:d,subject:sub,status:st})});document.getElementById('msg').textContent='Attendance saved successfully.';document.getElementById('msg').style.display='block';document.getElementById('subject').value='';await load()}catch(e){alert('Unable to save attendance. '+e.message);console.error(e)}finally{btn.disabled=false;btn.textContent='Save Attendance'}}
function init(){const list=window.PAVAN_DEMO_STUDENTS||[];document.getElementById('student').innerHTML=list.map(s=>'<option value="'+esc(s.username)+'">'+esc(s.name)+' — '+esc(s.username)+'</option>').join('');document.getElementById('date').value=new Date().toISOString().slice(0,10);load()}
if(guard())init();
</script><script src="assets/page-transition.js?v=20260923"></script>
</body></html>
