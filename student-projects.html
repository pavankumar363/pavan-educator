<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects | Pavan Educator</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}.top{height:72px;background:#fff;border-bottom:1px solid #e8ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800;color:#3157d5}.user{display:flex;gap:14px;align-items:center}.pill{background:#eef2ff;padding:8px 14px;border-radius:20px;font-weight:700}.logout{border:0;background:#172033;color:#fff;padding:9px 15px;border-radius:9px;cursor:pointer}.wrap{max-width:1150px;margin:35px auto;padding:0 20px}.hero{background:linear-gradient(135deg,#3157d5,#6845d9);color:#fff;border-radius:22px;padding:30px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;opacity:.9}.actions{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 17px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{background:#fff;border:1px solid #e7eaf1;border-radius:16px;padding:20px;box-shadow:0 5px 18px rgba(25,35,60,.05)}.card h3{margin:0 0 8px}.card p{color:#667085;min-height:48px}.links a{display:inline-block;margin-right:8px;margin-top:8px;color:#3157d5;text-decoration:none;font-weight:700}.empty{text-align:center;padding:45px;background:#fff;border-radius:16px;color:#667085}.modal{display:none;position:fixed;inset:0;background:rgba(10,15,30,.55);align-items:center;justify-content:center;padding:20px}.box{background:#fff;border-radius:18px;padding:25px;max-width:500px;width:100%}.box h2{margin-top:0}.box input,.box textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #d9deea;border-radius:9px;font:inherit}.box textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;justify-content:flex-end}.cancel{background:#e9edf5;color:#172033}.danger{background:#dc3545;margin-top:14px}@media(max-width:600px){.top{padding:0 16px}.user .pill{display:none}.hero h1{font-size:26px}.actions{gap:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">Pavan Educator</div><div class="user"><span class="pill" id="studentName">Student</span><button class="logout" onclick="logout()">Logout</button></div></header>
<main class="wrap">
<section class="hero"><h1>My Projects</h1><p>Create, manage and share your learning projects.</p></section>
<div class="actions"><h2>My Work</h2><button class="btn" onclick="openModal()">+ Add Project</button></div>
<div id="projects" class="grid"></div>
</main>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Add Project</h2><input id="title" placeholder="Project title"><textarea id="description" placeholder="Project description"></textarea><input id="demoUrl" placeholder="Project/demo link (optional)"><input id="githubUrl" placeholder="GitHub link (optional)"><div class="row"><button class="btn cancel" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveProject()">Save Project</button></div><button class="btn danger" id="deleteBtn" onclick="deleteProject()" style="display:none">Delete Project</button></div></div>
<script src="data/demo-students.js"></script>
<script src="data/demo-auth.js"></script>
<script>
let student=null, editIndex=-1;
function getStudent(){return window.PavanDemoAuth?.current()||null}
function key(){return 'pavanStudentProjects_'+student.username}
function load(){const list=JSON.parse(localStorage.getItem(key())||'[]');const el=document.getElementById('projects');if(!list.length){el.innerHTML='<div class="empty">No projects yet. Click <b>Add Project</b> to create your first project.</div>';return}el.innerHTML=list.map((p,i)=>`<article class="card"><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description||'No description')}</p><div class="links">${p.demoUrl?`<a href="${safeUrl(p.demoUrl)}" target="_blank" rel="noopener">Open Project</a>`:''}${p.githubUrl?`<a href="${safeUrl(p.githubUrl)}" target="_blank" rel="noopener">GitHub</a>`:''}</div><button class="btn" style="margin-top:14px" onclick="editProject(${i})">Edit</button></article>`).join('')}
function openModal(){editIndex=-1;document.getElementById('modalTitle').textContent='Add Project';document.getElementById('title').value='';document.getElementById('description').value='';document.getElementById('demoUrl').value='';document.getElementById('githubUrl').value='';document.getElementById('deleteBtn').style.display='none';document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function editProject(i){const p=JSON.parse(localStorage.getItem(key())||'[]')[i];editIndex=i;document.getElementById('modalTitle').textContent='Edit Project';document.getElementById('title').value=p.title;document.getElementById('description').value=p.description||'';document.getElementById('demoUrl').value=p.demoUrl||'';document.getElementById('githubUrl').value=p.githubUrl||'';document.getElementById('deleteBtn').style.display='block';document.getElementById('modal').style.display='flex'}
function saveProject(){const title=document.getElementById('title').value.trim();if(!title){alert('Please enter a project title.');return}const list=JSON.parse(localStorage.getItem(key())||'[]');const p={title,description:document.getElementById('description').value.trim(),demoUrl:document.getElementById('demoUrl').value.trim(),githubUrl:document.getElementById('githubUrl').value.trim()};if(editIndex<0)list.push(p);else list[editIndex]=p;localStorage.setItem(key(),JSON.stringify(list));closeModal();load()}
function deleteProject(){if(editIndex<0)return;if(!confirm('Delete this project?'))return;const list=JSON.parse(localStorage.getItem(key())||'[]');list.splice(editIndex,1);localStorage.setItem(key(),JSON.stringify(list));closeModal();load()}
function logout(){window.PavanDemoAuth.logout();location.href='login.html'}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeUrl(u){try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
student=getStudent();if(!student){location.href='login.html'}else{document.getElementById('studentName').textContent=student.name;load()}
</script>
</body>
</html>
