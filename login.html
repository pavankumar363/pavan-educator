<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pavan Educator | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;

    background:
        linear-gradient(135deg,#071a33,#123c73);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.login-container{
    width:100%;
    max-width:1000px;
    min-height:600px;

    background:white;

    border-radius:22px;
    overflow:hidden;

    display:grid;
    grid-template-columns:1fr 1fr;

    box-shadow:
        0 25px 60px rgba(0,0,0,.25);
}


/* LEFT */

.left{
    background:
        linear-gradient(145deg,#126df3,#5546f4);

    color:white;

    padding:60px 50px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:32px;
    font-weight:800;
    margin-bottom:60px;
}

.logo span{
    color:#dbe8ff;
}

.left h1{
    font-size:42px;
    line-height:1.15;
    margin-bottom:20px;
}

.left p{
    font-size:17px;
    line-height:1.7;
    opacity:.9;
    max-width:420px;
}

.features{
    margin-top:40px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.feature{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:15px;
}

.feature-icon{
    width:35px;
    height:35px;

    border-radius:9px;

    background:
        rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;
}


/* RIGHT */

.right{
    padding:55px 50px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right h2{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#718096;
    font-size:14px;
    margin-bottom:30px;
}


/* ROLE */

.role-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
}

.roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:25px;
}

.role{
    border:1px solid #d9e2ef;

    border-radius:9px;

    padding:13px;

    text-align:center;

    cursor:pointer;

    font-weight:700;
    font-size:13px;

    transition:.2s;
}

.role:hover{
    border-color:#2474ff;
}

.role.selected{
    background:#2474ff;
    color:white;
    border-color:#2474ff;
}


/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    font-size:13px;
    font-weight:700;

    margin-bottom:7px;
}

.form-group input{
    width:100%;
    height:48px;

    padding:0 14px;

    border:1px solid #d5deec;

    border-radius:9px;

    outline:none;

    font-size:14px;
}

.form-group input:focus{
    border-color:#2474ff;

    box-shadow:
        0 0 0 3px
        rgba(36,116,255,.08);
}


/* REMEMBER */

.remember{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:22px;

    color:#64748b;

    font-size:13px;
}


/* BUTTON */

.login-btn{
    width:100%;
    height:50px;

    border:none;
    border-radius:9px;

    background:#2474ff;

    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
}

.login-btn:hover{
    background:#155bd4;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* MESSAGE */

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    font-size:13px;

    text-align:center;
}

.message.error{
    display:block;

    background:#fff0f0;
    color:#c62828;
}

.message.success{
    display:block;

    background:#eaf8ef;
    color:#16834b;
}


/* FOOTER */

.footer{
    text-align:center;

    color:#9aa5b6;

    font-size:12px;

    margin-top:25px;
}


/* MOBILE */

@media(max-width:750px){

    .login-container{
        grid-template-columns:1fr;
    }

    .left{
        padding:40px 30px;
    }

    .left h1{
        font-size:32px;
    }

    .right{
        padding:40px 30px;
    }

}

</style>

</head>


<body>


<div class="login-container">


<!-- LEFT -->

<section class="left">

    <div class="logo">
        Pavan <span>Educator</span>
    </div>


    <h1>
        Learn.<br>
        Build.<br>
        Grow.
    </h1>


    <p>
        Welcome to your learning platform.
        Access projects, courses and your
        personal student space.
    </p>


    <div class="features">

        <div class="feature">

            <div class="feature-icon">
                🎓
            </div>

            Student Dashboard

        </div>


        <div class="feature">

            <div class="feature-icon">
                💻
            </div>

            Student Projects

        </div>


        <div class="feature">

            <div class="feature-icon">
                👤
            </div>

            Personal Profile

        </div>

    </div>

</section>



<!-- RIGHT -->

<section class="right">

    <h2>
        Welcome Back
    </h2>

    <p class="subtitle">
        Login to continue to Pavan Educator
    </p>


    <div class="role-title">
        Login as
    </div>


    <div class="roles">


        <div
            class="role selected"
            id="studentRole"
            onclick="selectRole('Student')"
        >
            🎓 Student
        </div>


        <div
            class="role"
            id="adminRole"
            onclick="selectRole('Admin')"
        >
            🛡️ Admin
        </div>


    </div>


    <form
        id="loginForm"
        onsubmit="login(event)"
    >


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <label class="remember">

            <input
                type="checkbox"
                id="remember"
            >

            Remember me

        </label>


        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            LOGIN
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="footer">
        © 2026 Pavan Educator
    </div>


</section>


</div>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jlrmmkgcjckkayearlca.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ROLE
========================================= */

let selectedRole = "Student";


function selectRole(role){

    selectedRole = role;


    document
        .getElementById("studentRole")
        .classList
        .remove("selected");


    document
        .getElementById("adminRole")
        .classList
        .remove("selected");


    document
        .getElementById(
            role === "Student"
                ? "studentRole"
                : "adminRole"
        )
        .classList
        .add("selected");

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =========================================
   ADMIN LOGIN
========================================= */

async function adminLogin(
    username,
    password
){

    if(
        username.trim().toLowerCase()
        !==
        "admin"
    ){

        throw new Error(
            "Invalid admin username or password."
        );

    }


    const {
        data,
        error
    } =
        await supabaseClient.auth
        .signInWithPassword({

            email:
                "admin@pavaneducator.local",

            password:
                password

        });


    if(error){

        throw new Error(
            "Invalid admin username or password."
        );

    }


    sessionStorage.setItem(
        "currentRole",
        "Admin"
    );


    sessionStorage.setItem(
        "currentUser",
        "admin"
    );


    showMessage(
        "Admin login successful...",
        "success"
    );


    setTimeout(
        function(){

            window.location.href =
                "admin-dashboard.html";

        },
        700
    );

}


/* =========================================
   STUDENT LOGIN
========================================= */

async function studentLogin(
    username,
    password
){

    const email =
        username
            .trim()
            .toLowerCase()
        +
        "@pavaneducator.local";


    const {
        data,
        error
    } =
        await supabaseClient.auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });


    if(error){

        throw new Error(
            "Invalid student username or password."
        );

    }


    /*
       Student profile will be connected
       after we create the student system.
    */

    const {
        data: student,
        error: profileError
    } =
        await supabaseClient
        .from("students")
        .select("*")
        .eq(
            "auth_user_id",
            data.user.id
        )
        .maybeSingle();


    if(profileError){

        await supabaseClient.auth.signOut();

        throw new Error(
            "Unable to load student profile."
        );

    }


    if(!student){

        await supabaseClient.auth.signOut();

        throw new Error(
            "Student profile not found."
        );

    }


    sessionStorage.setItem(
        "currentRole",
        "Student"
    );


    sessionStorage.setItem(
        "currentUser",
        student.username
    );


    sessionStorage.setItem(
        "studentName",
        student.name || ""
    );


    showMessage(
        "Login successful...",
        "success"
    );


    setTimeout(
        function(){

            window.location.href =
                "student-dashboard.html";

        },
        700
    );

}


/* =========================================
   MAIN LOGIN
========================================= */

async function login(event){

    event.preventDefault();


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled =
        true;

    button.textContent =
        "LOGGING IN...";


    try{

        if(
            selectedRole ===
            "Admin"
        ){

            await adminLogin(
                username,
                password
            );

        }
        else{

            await studentLogin(
                username,
                password
            );

        }

    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Login failed.",
            "error"
        );

        button.disabled =
            false;

        button.textContent =
            "LOGIN";

    }

}

</script>


</body>

</html>
