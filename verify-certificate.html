<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | Pavan Educator</title><link rel="icon" href="assets/pavan-logo.svg"><style>body{margin:0;background:#f5f8fd;font-family:Arial;color:#14213a}.wrap{max-width:850px;margin:auto;padding:35px}.card{background:#fff;border:1px solid #dfe7f2;border-radius:20px;padding:35px;box-shadow:0 15px 40px #17345c12}.brand{font-size:24px;font-weight:900}.brand span{color:#1767df}h1{font-size:38px}.input{width:100%;padding:14px;border:1px solid #d8e2ef;border-radius:10px;font-size:16px;box-sizing:border-box}.btn{margin-top:10px;border:0;background:#1767df;color:#fff;padding:12px 17px;border-radius:10px;font-weight:900;cursor:pointer}.ok{margin-top:18px;padding:18px;border-radius:14px;background:#effaf5;border:1px solid #c9eedf}.bad{margin-top:18px;padding:18px;border-radius:14px;background:#fff2f2;border:1px solid #f0d0d0}</style></head><body><div class="wrap"><div class="brand">Pavan <span>Educator</span></div><div class="card"><small>THE FUTURE LEARNING PLATFORM</small><h1>Certificate Verification</h1><p>Verify a Pavan Educator certificate using its unique certificate ID.</p><input id="id" class="input" placeholder="Enter certificate ID"><button class="btn" onclick="verify()">Verify Certificate</button><div id="result"></div></div></div><script>const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';async function verify(){const id=document.getElementById('id').value.trim();if(!id)return;const r=await fetch(U+'/rest/v1/student_certificates?certificate_id=eq.'+encodeURIComponent(id)+'&select=certificate_id,username,course_name,issued_at,completion_percent',{headers:{apikey:K,Authorization:'Bearer '+K}});const a=r.ok?await r.json():[];document.getElementById('result').innerHTML=a[0]?'<div class="ok"><h2>✓ Certificate Verified</h2><p><b>Course:</b> '+a[0].course_name+'</p><p><b>Certificate ID:</b> '+a[0].certificate_id+'</p><p><b>Completion:</b> '+a[0].completion_percent+'%</p><p><b>Issued:</b> '+new Date(a[0].issued_at).toLocaleDateString()+'</p></div>':'<div class="bad"><b>Certificate not found.</b><br>Check the certificate ID and try again.</div>'}</script></body></html>
