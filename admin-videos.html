<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pavan Educator | Manage Videos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fc;
    color: #172033;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;
    overflow-y:auto;
    overflow-x:hidden;
    background: #111a2e;
    color: white;
    padding: 25px 18px;
}

.logo {
    padding: 10px 12px 30px;
    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #4d8dff;
}

.admin-label {
    color: #8e9bb3;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 0 12px 12px;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 7px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 14px;
    color: #c9d2e3;
    text-decoration: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
}

.menu a:hover,
.menu a.active {
    background: #2563eb;
    color: white;
}

.menu-icon {
    width: 24px;
    text-align: center;
}

.logout {
    position: absolute;
    bottom: 25px;
    left: 18px;
    right: 18px;
}

.logout a {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 9px;
    background: #1c2944;
    color: #c9d2e3;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

.logout a:hover {
    background: #dc3545;
    color: white;
}

/* MAIN */

.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    height: 75px;
    background: white;
    border-bottom: 1px solid #e2e8f2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
}

.page-title h1 {
    font-size: 23px;
}

.page-title p {
    color: #7a869b;
    font-size: 13px;
    margin-top: 4px;
}

.back-link {
    text-decoration: none;
    color: #2563eb;
    font-weight: 700;
    font-size: 14px;
}

.content {
    padding: 35px;
}

/* HEADER */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h2 {
    font-size: 28px;
}

.page-header p {
    color: #7a869b;
    margin-top: 6px;
    font-size: 14px;
}

.add-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 13px 20px;
    border-radius: 9px;
    font-weight: 700;
    cursor: pointer;
}

.add-btn:hover {
    background: #1d4ed8;
}

/* SEARCH */

.search-box {
    width: 100%;
    height: 52px;
    background: white;
    border: 1px solid #dce4f0;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    outline: none;
    margin-bottom: 25px;
}

.search-box:focus {
    border-color: #2563eb;
}

/* VIDEO GRID */

.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.video-card {
    background: white;
    border: 1px solid #e1e7f2;
    border-radius: 15px;
    overflow: hidden;
    transition: .2s;
}

.video-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 35px rgba(30,70,140,.08);
}

.video-thumbnail {
    height: 160px;
    background: linear-gradient(135deg,#e9f0ff,#f7faff);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.play-icon {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    padding-left: 4px;
}

.duration {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: rgba(0,0,0,.75);
    color: white;
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 11px;
}

.video-info {
    padding: 22px;
}

.video-category {
    color: #2563eb;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

.video-info h3 {
    margin: 10px 0;
    font-size: 20px;
}

.video-info p {
    color: #687389;
    font-size: 13px;
    line-height: 1.6;
}

.video-actions {
    display: flex;
    gap: 9px;
    margin-top: 18px;
}

.watch-btn,
.edit-btn,
.delete-btn {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
}

.watch-btn {
    background: #2563eb;
    color: white;
}

.edit-btn {
    background: #eaf1ff;
    color: #2563eb;
}

.delete-btn {
    background: #fff0f0;
    color: #dc3545;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,40,.55);
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 23px;
}

.close-btn {
    border: none;
    background: #f0f3f8;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #d5deec;
    border-radius: 8px;
    padding: 12px;
    font-family: inherit;
    outline: none;
}

.form-group textarea {
    height: 90px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #2563eb;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

.cancel-btn,
.save-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
}

.cancel-btn {
    border: 1px solid #d5deec;
    background: white;
    color: #687389;
}

.save-btn {
    border: none;
    background: #2563eb;
    color: white;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px solid #e1e7f2;
    border-radius: 15px;
    padding: 50px;
    text-align: center;
    color: #7a869b;
    grid-column: 1 / -1;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

/* MOBILE */

@media(max-width:1000px) {

    .sidebar {
        width: 210px;
    }

    .main {
        margin-left: 210px;
    }

    .video-grid {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:700px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .logout {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        margin-top: 20px;
    }

    .topbar {
        padding: 0 20px;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        Pavan <span>Educator</span>
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

    <ul class="menu">

        <li>
            <a href="admin-dashboard.html">
                <span class="menu-icon">🏠</span>
                Dashboard
            </a>
        </li>

        <li>
            <a href="admin-courses.html">
                <span class="menu-icon">📚</span>
                Courses
            </a>
        </li>

        <li>
            <a href="admin-projects.html">
                <span class="menu-icon">💻</span>
                Projects
            </a>
        </li>

        <li>
            <a href="admin-videos.html" class="active">
                <span class="menu-icon">🎥</span>
                Videos
            </a>
        </li>

        <li>
            <a href="admin-students.html">
                <span class="menu-icon">🎓</span>
                Students
            </a>
        </li>

        <li>
            <a href="admin-settings.html">
                <span class="menu-icon">⚙️</span>
                Settings
            </a>
        </li>

    </ul>

    <div class="logout">

        <a href="login.html" onclick="logout()">
            🚪 Logout
        </a>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

        <div class="page-title">

            <h1>
                Video Management
            </h1>

            <p>
                Add and manage educational videos
            </p>

        </div>

        <a
            href="admin-dashboard.html"
            class="back-link"
        >
            ← Dashboard
        </a>

    </header>


    <!-- CONTENT -->

    <div class="content">


        <div class="page-header">

            <div>

                <h2>
                    Videos
                </h2>

                <p>
                    Create, edit and remove educational videos.
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + Add Video
            </button>

        </div>


        <!-- SEARCH -->

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search videos..."
            onkeyup="renderVideos()"
        >


        <!-- VIDEO GRID -->

        <div
            class="video-grid"
            id="videoGrid"
        ></div>


    </div>

</main>


<!-- MODAL -->

<div
    class="modal"
    id="videoModal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Video
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form onsubmit="saveVideo(event)">


            <div class="form-group">

                <label>
                    Video Title
                </label>

                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Example: Java Programming Basics"
                    required
                >

            </div>


            <div class="form-group">
                <label>Course</label>
                <select id="videoCourse" required><option value="">Loading courses...</option></select>
            </div>

            <div class="form-group">

                <label>
                    Category
                </label>

                <select id="videoCategory">

                    <option>
                        Programming
                    </option>

                    <option>
                        Web Development
                    </option>

                    <option>
                        Database
                    </option>

                    <option>
                        Project
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="videoDescription"
                    placeholder="Enter video description..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    YouTube / Video Link
                </label>

                <input
                    type="url"
                    id="videoLink"
                    placeholder="https://www.youtube.com/watch?v=..."
                >

            </div>


            <div class="form-group">

                <label>
                    Duration
                </label>

                <input
                    type="text"
                    id="videoDuration"
                    placeholder="Example: 12:30"
                >

            </div>


            <div class="form-group">

                <label>
                    Icon / Emoji
                </label>

                <input
                    type="text"
                    id="videoIcon"
                    placeholder="▶️"
                    maxlength="4"
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Video
                </button>

            </div>


        </form>

    </div>

</div>


<script>

const SB='https://jlrmmkgcjckkayearlca.supabase.co',SK='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH',HEAD={apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'};let videos=[],courses=[],editingId=null;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
async function api(path,opt={}){const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...HEAD,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function load(){try{courses=await api('course_catalog?select=id,course_name,class_name&published=eq.true&order=course_name');document.getElementById('videoCourse').innerHTML='<option value="">Select course</option>'+courses.map(c=>'<option value="'+c.id+'">'+esc(c.course_name)+' — '+esc(c.class_name||'All Classes')+'</option>').join('');videos=await api('course_videos?select=id,course_id,title,description,video_url,duration,thumbnail_url,lesson_no,published&order=course_id,lesson_no,id');renderVideos()}catch(e){console.error(e);document.getElementById('videoGrid').innerHTML='<div class="empty"><div class="empty-icon">🎥</div><h3>Video library unavailable</h3><p>Check the Supabase connection and published courses.</p></div>'}}
function renderVideos(){const grid=document.getElementById('videoGrid'),q=document.getElementById('search').value.toLowerCase().trim(),list=videos.filter(v=>(v.title+' '+(v.description||'')+' '+courseName(v.course_id)).toLowerCase().includes(q));grid.innerHTML=list.length?list.map(v=>'<div class="video-card"><div class="video-thumbnail"><div class="play-icon">▶️</div><div class="duration">'+esc(v.duration||'--:--')+'</div></div><div class="video-info"><div class="video-category">'+esc(courseName(v.course_id))+'</div><h3>'+esc(v.title)+'</h3><p>'+esc(v.description||'')+'</p><div class="video-actions">'+(v.video_url?'<a href="'+esc(v.video_url)+'" target="_blank" class="watch-btn">▶ Watch</a>':'<button class="watch-btn" onclick="alert(\'No video link added yet.\')">▶ Watch</button>')+'<button class="edit-btn" onclick="editVideo('+v.id+')">✏️ Edit</button><button class="delete-btn" onclick="deleteVideo('+v.id+')">🗑️ Delete</button></div></div></div>').join(''):'<div class="empty"><div class="empty-icon">🎥</div><h3>No videos found</h3><p>Add a video to a published course.</p></div>'}
function courseName(id){const c=courses.find(x=>String(x.id)===String(id));return c?c.course_name:'Course'}
function openAddModal(){editingId=null;document.getElementById('modalTitle').textContent='Add Video';['videoTitle','videoDescription','videoLink','videoDuration','videoIcon'].forEach(id=>document.getElementById(id).value='');document.getElementById('videoCourse').value='';document.getElementById('videoModal').classList.add('show')}
function editVideo(id){const v=videos.find(x=>Number(x.id)===Number(id));if(!v)return;editingId=v.id;document.getElementById('modalTitle').textContent='Edit Video';document.getElementById('videoCourse').value=v.course_id;document.getElementById('videoTitle').value=v.title||'';document.getElementById('videoDescription').value=v.description||'';document.getElementById('videoLink').value=v.video_url||'';document.getElementById('videoDuration').value=v.duration||'';document.getElementById('videoModal').classList.add('show')}
async function saveVideo(e){e.preventDefault();const course_id=Number(document.getElementById('videoCourse').value),title=document.getElementById('videoTitle').value.trim(),description=document.getElementById('videoDescription').value.trim(),video_url=document.getElementById('videoLink').value.trim(),duration=document.getElementById('videoDuration').value.trim();if(!course_id||!title||!description)return;const body={course_id,title,description,video_url,duration,published:true};try{const path=editingId?'course_videos?id=eq.'+editingId:'course_videos';await api(path,{method:editingId?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});closeModal();await load();alert(editingId?'Video updated successfully!':'Video added successfully!')}catch(err){alert('Unable to save video. '+err.message)}}
async function deleteVideo(id){const v=videos.find(x=>Number(x.id)===Number(id));if(!v||!confirm('Delete "'+v.title+'"?'))return;try{await api('course_videos?id=eq.'+id,{method:'DELETE'});await load();alert('Video deleted successfully!')}catch(e){alert('Unable to delete video. '+e.message)}}
function closeModal(){document.getElementById('videoModal').classList.remove('show')}
function logout(){sessionStorage.removeItem('currentRole');sessionStorage.removeItem('currentUser')}
if(sessionStorage.getItem('adminLoggedIn')!=='true'||sessionStorage.getItem('currentRole')!=='Admin')location.href='login.html';else load();
</script>

<script src="assets/page-transition.js?v=20260929"></script></body>
</html>

<style>.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-track{background:transparent}.sidebar::-webkit-scrollbar-thumb{background:#334563;border-radius:10px}.sidebar::-webkit-scrollbar-thumb:hover{background:#4d6a94}</style>
