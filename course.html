<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pavan Educator | Course</title><link rel="icon" href="assets/pavan-logo.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8ff;color:#172033}.nav{height:74px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 7%}.logo{font-size:23px;font-weight:800;text-decoration:none;color:#172033}.logo span{color:#2563eb}.back{color:#2563eb;text-decoration:none;font-weight:700}.wrap{max-width:1050px;margin:auto;padding:35px 20px}.hero{background:linear-gradient(110deg,#126df3,#5645f4);color:#fff;border-radius:18px;padding:32px;margin-bottom:20px}.hero h1{margin:8px 0}.hero p{opacity:.9;line-height:1.6}.progress{height:10px;background:#dfe7f5;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2474ff;border-radius:20px}.lesson{background:#fff;border:1px solid #e0e7f2;border-radius:15px;padding:23px;margin-bottom:14px}.lesson.done{border-color:#8cc9a9}.lesson h3{margin:0 0 9px}.lesson p{color:#65738a;line-height:1.7;white-space:pre-line}.btn{border:0;border-radius:9px;background:#2474ff;color:#fff;padding:11px 17px;font-weight:700;cursor:pointer}.muted{color:#718096;font-size:13px}.empty{text-align:center;background:#fff;border:1px solid #e0e7f2;padding:45px;border-radius:15px}</style><script src="data/demo-students.js?v=20260929"></script><script src="data/demo-auth.js?v=20260929"></script><script src="assets/student-access.js?v=20260929"></script><script src="assets/page-transition.js?v=20260929"></script></head><body><header class="nav"><a class="logo" href="index.html">Pavan <span>Educator</span></a><a class="back" href="courses.html">← All Courses</a></header><main class="wrap"><section id="hero" class="hero"><div>COURSE</div><h1 id="title">Loading…</h1><p id="desc"></p><div class="progress"><div id="fill" class="fill" style="width:0"></div></div><p id="pct" class="muted" style="color:#fff;margin-bottom:0"></p></section><section id="lessons"></section></main><script>const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};let course,lessons=[],student;async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{headers:H,...o});if(!r.ok)throw Error(await r.text());return r.json()}async function init(){student=JSON.parse(sessionStorage.getItem('pavanDemoStudent')||'null');const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('lessons').innerHTML='<div class="empty">Course not found.</div>';return}try{const cs=await api('course_catalog?id=eq.'+id+'&select=*');course=cs[0];if(!course)throw Error();lessons=await api('course_lessons?course_id=eq.'+id+'&published=eq.true&select=*&order=lesson_no.asc');document.getElementById('title').textContent=course.course_name;document.getElementById('desc').textContent=course.description;render()}catch(e){document.getElementById('lessons').innerHTML='<div class="empty">This course could not be loaded.</div>'}}async function render(){let p=student?await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name)+'&select=*'):[];let done=p[0]?.completed_lessons||0;let total=Math.max(lessons.length,1);let percent=Math.round(done/total*100);document.getElementById('fill').style.width=percent+'%';document.getElementById('pct').textContent=done+' of '+lessons.length+' lessons completed • '+percent+'%';const box=document.getElementById('lessons');if(!lessons.length){box.innerHTML='<div class="empty">Lessons will be added to this course soon.</div>';return}box.innerHTML=lessons.map((x,i)=>'<article class="lesson '+(i<done?'done':'')+'"><h3>Lesson '+x.lesson_no+': '+esc(x.title)+'</h3><p>'+esc(x.content||'Lesson content will be available soon.')+'</p>'+(x.video_url?'<a class="btn" href="'+esc(x.video_url)+'" target="_blank">▶ Watch Lesson Video</a> ':'')+(i<done?'<span class="muted"> ✓ Completed</span>':(i===done&&student?'<button class="btn" onclick="completeLesson()">Mark Complete</button>':''))+'</article>').join('')}async function completeLesson(){let current=0;const p=await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name)+'&select=*');if(p[0])current=p[0].completed_lessons;const next=Math.min(current+1,lessons.length);const percent=Math.round(next/Math.max(lessons.length,1)*100);const body={username:student.username,course_name:course.course_name,completed_lessons:next,total_lessons:lessons.length,percent,last_activity:new Date().toISOString()};await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name),{method:'PATCH',body:JSON.stringify(body)}).catch(async()=>api('student_learning_progress',{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(body)}));render()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();</script></body></html>
