<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Choose your class on Pavan Educator and explore learning resources.">
<link rel="icon" type="image/svg+xml" href="assets/pavan-logo.svg">
<title>Pavan Educator | Choose Your Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f5f8ff;color:#172033;min-height:100vh}
.navbar{height:74px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #e6ebf5;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800;color:#172033;text-decoration:none}.logo img{width:42px;height:42px}.logo span{color:#2563eb}
.nav-links{display:flex;gap:28px;list-style:none}.nav-links a{text-decoration:none;color:#4d5870;font-size:14px;font-weight:600}.nav-links a:hover,.nav-links a.active{color:#2563eb}
.auth-buttons{display:flex;align-items:center;gap:10px}.login-btn,.signup-btn{color:#fff;text-decoration:none;border-radius:8px;font-weight:700}.login-btn{background:#2563eb;padding:11px 23px}.signup-btn{background:#fff;color:#2563eb;border:1px solid #2563eb;padding:10px 21px}
.page{min-height:calc(100vh - 74px);padding:55px 20px;display:flex;align-items:flex-start;justify-content:center}
.chooser{width:min(900px,100%);background:linear-gradient(135deg,#eefaff,#f7fbff);border:1px solid #dbe8f4;border-radius:24px;box-shadow:0 25px 70px rgba(25,75,130,.14);padding:28px 42px 38px}
.chooser-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:28px}.chooser-head h1{text-align:center;font-size:22px}.head-btn{width:40px;height:40px;border:0;background:transparent;color:#7890a5;font-size:34px;cursor:pointer;border-radius:50%}.head-btn:hover{background:#e9f3fb}
.search-btn{font-size:26px}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.class-card{display:flex;align-items:center;gap:15px;min-height:78px;padding:13px 18px;background:#fff;border:1px solid #e1e8f0;border-radius:10px;text-decoration:none;color:#172033;box-shadow:0 2px 8px rgba(20,60,100,.03);transition:.2s}
.class-card:hover{transform:translateY(-2px);border-color:#9bc6f2;box-shadow:0 8px 22px rgba(30,100,180,.10)}
.class-icon{width:48px;height:48px;border-radius:50%;background:#eff8ff;display:flex;align-items:center;justify-content:center;font-size:29px;flex:none}.class-name{font-size:15px;font-weight:800;flex:1}.arrow{font-size:27px;color:#8aa0ae}
.subtext{text-align:center;color:#718096;font-size:12px;margin:24px 0 0}
.footer{text-align:center;color:#718096;font-size:12px;padding:25px}
@media(max-width:700px){.nav-links{display:none}.navbar{padding:0 5%}.page{padding:25px 12px}.chooser{padding:20px 15px 28px;border-radius:18px}.class-grid{grid-template-columns:1fr;gap:12px}.chooser-head{margin-bottom:20px}.chooser-head h1{font-size:20px}}
</style>
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo"><img src="assets/pavan-logo.svg" alt="Pavan Educator logo"><span>Pavan Educator</span></a>
<ul class="nav-links">
<li><a href="index.html">Home</a></li><li><a href="classes.html" class="active">Classes</a></li><li><a href="what-we-have.html">What We Have</a></li><li><a href="search.html">Search</a></li><li><a href="digital-library.html">Library</a></li><li><a href="about.html">About</a></li>
</ul>
<div class="auth-buttons"><a href="login.html" class="login-btn">Login</a><a href="signup.html" class="signup-btn">Sign Up</a></div>
</header>
<main class="page">
<section class="chooser" aria-label="Choose your class">
<div class="chooser-head">
<a class="head-btn" href="index.html" aria-label="Back">‹</a>
<h1>Choose Your Class</h1>
<button class="head-btn search-btn" onclick="focusSearch()" aria-label="Search classes">⌕</button>
</div>
<input id="classSearch" aria-label="Search classes" placeholder="Search class..." style="display:none;width:100%;padding:12px 15px;border:1px solid #d7e3ef;border-radius:10px;margin:-10px 0 18px;font:inherit;outline:none">
<div class="class-grid" id="classGrid"></div>
<p class="subtext">Choose your class to continue to learning resources on Pavan Educator.</p>
</section>
</main>
<footer class="footer">Pavan Educator • Learn • Build • Grow</footer>
<script>
const classes=[
['LKG','🧸'],['UKG','✏️'],['Class 1','🔢'],['Class 2','🍎'],['Class 3','📚'],['Class 4','🖍️'],
['Class 5','📐'],['Class 6','🌍'],['Class 7','📖'],['Class 8','📐'],['Class 9','🌎'],['Class 10','🔬'],
['Class 11','🧪'],['Class 12','🎓']
];
const grid=document.getElementById('classGrid');
function render(list){grid.innerHTML=list.map(([name,icon])=>'<a class="class-card" href="class.html?class='+encodeURIComponent(name)+'"><span class="class-icon">'+icon+'</span><span class="class-name">'+name+'</span><span class="arrow">›</span></a>').join('')}
function focusSearch(){const e=document.getElementById('classSearch');e.style.display='block';e.focus()}
document.getElementById('classSearch').addEventListener('input',function(){const q=this.value.toLowerCase();render(classes.filter(x=>x[0].toLowerCase().includes(q)))});
render(classes);
</script>
<script src="assets/page-transition.js?v=20261001"></script>
</body>
</html>
