<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | My Certificates</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top a{color:#2474ff;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.cert{background:#fff;border:1px solid #dbe4f0;border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(30,70,140,.06)}.paper{border:2px solid #2474ff;border-radius:10px;padding:25px;text-align:center;background:linear-gradient(135deg,#fff,#f7faff)}.logo{font-size:22px;font-weight:800}.logo span{color:#2474ff}.award{font-size:40px;margin:12px}.paper h2{font-family:Georgia,serif;margin:8px 0}.course{font-size:20px;font-weight:800;color:#2474ff;margin:10px 0}.meta{font-size:11px;color:#718096;margin-top:15px}.btn{display:inline-block;margin-top:15px;background:#2474ff;color:#fff;text-decoration:none;border-radius:8px;padding:10px 15px;font-size:13px;font-weight:700}.empty{background:#fff;border:1px solid #e1e7f2;border-radius:15px;padding:45px;text-align:center;color:#718096}.note{font-size:12px;color:#718096;line-height:1.6}@media print{.top,.note,.btn{display:none}.wrap{padding:0}.grid{display:block}.cert{page-break-after:always;border:0;box-shadow:none}.paper{margin:30px auto;max-width:800px}}</style></head><body><main class="wrap"><header class="top"><div><h1>🎓 My Certificates</h1><p style="color:#718096">Certificates for completed courses.</p></div><a href="student-dashboard.html">← Dashboard</a></header><div id="list"></div><p class="note">Certificates are issued when a course reaches 100% completion. Each certificate has a unique certificate ID.</p></main><script src="data/demo-students.js"></script><script src="data/demo-auth.js"></script><script>const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{headers:H,...o});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const s=PavanDemoAuth.current();if(!s){location.href='login.html';return}try{const progress=await api('student_learning_progress?username=eq.'+encodeURIComponent(s.username)+'&percent=eq.100&select=course_name,total_lessons,completed_lessons,last_activity&order=last_activity.desc');const existing=await api('student_certificates?username=eq.'+encodeURIComponent(s.username)+'&select=*');for(const p of progress){if(!existing.some(x=>x.course_name===p.course_name)){const id='PE-'+new Date().getFullYear()+'-'+s.username.toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();await api('student_certificates',{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify({certificate_id:id,username:s.username,course_name:p.course_name,completion_percent:100})})}}const rows=await api('student_certificates?username=eq.'+encodeURIComponent(s.username)+'&select=*&order=issued_at.desc');document.getElementById('list').innerHTML=rows.length?'<div class="grid">'+rows.map(x=>'<article class="cert"><div class="paper"><div class="logo">Pavan <span>Educator</span></div><div class="award">🏆</div><div>Certificate of Completion</div><h2>This certifies that</h2><h2>'+esc(s.name)+'</h2><div>has successfully completed</div><div class="course">'+esc(x.course_name)+'</div><div class="meta">Certificate ID: '+esc(x.certificate_id)+'<br>Issued: '+new Date(x.issued_at).toLocaleDateString()+'<br>Completion: '+x.completion_percent+'%</div><a class="btn" href="#" onclick="print();return false">🖨 Print Certificate</a></div></article>').join('')+'</div>':'<div class="empty"><h2>No certificates yet</h2><p>Complete a course to 100% and your certificate will appear here.</p></div>'}catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="empty">Certificates could not be loaded right now.</div>'}}init();</script></body></html>
