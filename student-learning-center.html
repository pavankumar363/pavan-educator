<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Center | Pavan Educator</title><link rel="icon" href="assets/pavan-logo.svg"><link rel="stylesheet" href="assets/platform.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8fd;color:#14213a}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{font-size:23px;font-weight:900}.brand span{color:#246cf3}.back{color:#1764db;text-decoration:none;font-weight:800}.hero{padding:32px;border-radius:22px;color:#fff;background:linear-gradient(120deg,#126df3,#5545f5);box-shadow:0 18px 45px #1f57d522}.hero h1{margin:8px 0;font-size:38px}.hero p{opacity:.92;max-width:760px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid #dce5f1;background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;color:#38506f;cursor:pointer}.tab.active{background:#1767df;color:#fff}.panel{background:#fff;border:1px solid #e1e8f2;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px #193a6d0a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:16px;border:1px solid #e2e9f3;border-radius:13px}.kpi b{display:block;font-size:25px}.muted{color:#738197;font-size:13px}.list{display:grid;gap:9px}.item{padding:14px;border:1px solid #e2e9f3;border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{display:inline-block;border:0;background:#1767df;color:#fff;border-radius:9px;padding:9px 12px;text-decoration:none;font-weight:800;cursor:pointer}.btn.alt{background:#edf4ff;color:#1764db}.search{width:100%;padding:12px;border:1px solid #dbe4ef;border-radius:10px;font-size:14px}.goal{display:flex;gap:8px}.goal input{flex:1;padding:11px;border:1px solid #dbe4ef;border-radius:9px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.hero h1{font-size:30px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">Pavan <span>Educator</span></div><a class="back" href="student-dashboard.html">← Student Dashboard</a></div><section class="hero"><small>WORLD-CLASS STUDENT PLATFORM</small><h1>My Learning Center</h1><p>One place for your learning progress, courses, quizzes, achievements, certificates, goals and personal study tools.</p></section><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="courses">Courses</button><button class="tab" data-tab="quizzes">Quizzes</button><button class="tab" data-tab="certificates">Certificates</button><button class="tab" data-tab="tools">My Study Tools</button></div><section id="overview" class="panel"></section><section id="courses" class="panel" hidden></section><section id="quizzes" class="panel" hidden></section><section id="certificates" class="panel" hidden></section><section id="tools" class="panel" hidden></section></div>
<script src="data/demo-auth.js"></script><script>
const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH',H={apikey:K,Authorization:'Bearer '+K};
const s=window.PavanDemoAuth&&PavanDemoAuth.current();if(!s)location.href='login.html?next=student-learning-center.html';
const user=s||{username:'student',name:'Student'};let courses=[],progress=[],quizzes=[],certs=[];
const get=(p)=>fetch(U+'/rest/v1/'+p,{headers:H}).then(r=>r.ok?r.json():[]);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function local(){return JSON.parse(localStorage.getItem('pavanStudyTools_'+(user.username||'student'))||'{"bookmarks":[],"notes":[],"goals":[]}')}
function save(x){localStorage.setItem('pavanStudyTools_'+(user.username||'student'),JSON.stringify(x))}
function renderOverview(){let xp=(JSON.parse(localStorage.getItem('pavanFutureAIProgress')||'{}').xp||0);document.querySelector('#overview').innerHTML='<h2>Welcome, '+esc(user.name||'Student')+' 👋</h2><p class="muted">Your learning command center.</p><div class="grid"><div class="kpi"><b>'+xp+'</b><span class="muted">Future AI XP</span></div><div class="kpi"><b>'+progress.length+'</b><span class="muted">Course Progress Records</span></div><div class="kpi"><b>'+quizzes.length+'</b><span class="muted">Available Quizzes</span></div><div class="kpi"><b>'+certs.length+'</b><span class="muted">Certificates</span></div><div class="kpi"><b>'+new Set(progress.map(x=>x.course_name)).size+'</b><span class="muted">Courses Started</span></div><div class="kpi"><b>'+local().goals.length+'</b><span class="muted">Personal Goals</span></div></div><h3>Recommended journey</h3><p class="muted">Learn a lesson → watch → practice → take a quiz → create a project → add evidence to your portfolio → earn your certificate.</p>'}
function renderCourses(){const q=document.querySelector('#courseSearch')?.value?.toLowerCase()||'';const rows=courses.filter(x=>(x.course_name+' '+x.description).toLowerCase().includes(q));document.querySelector('#courses').innerHTML='<h2>My Courses</h2><input id="courseSearch" class="search" placeholder="Search courses..." value="'+esc(q)+'"><div class="list" style="margin-top:12px">'+(rows.length?rows.map(x=>'<div class="item"><div><b>'+esc(x.course_name)+'</b><div class="muted">'+esc(x.description||'')+'</div></div><a class="btn" href="course.html?id='+x.id+'">Open →</a></div>').join(''):'<div class="muted">No courses found.</div>')+'</div>';document.querySelector('#courseSearch').oninput=renderCourses}
function renderQuizzes(){document.querySelector('#quizzes').innerHTML='<h2>Assessments</h2><p class="muted">Take published quizzes and build measurable learning evidence.</p><div class="list">'+(quizzes.length?quizzes.map(q=>'<div class="item"><div><b>'+esc(q.title)+'</b><div class="muted">'+esc(q.description||'')+' • '+q.duration_minutes+' min</div></div><a class="btn" href="student-quiz.html?id='+q.id+'">Start →</a></div>').join(''):'<div class="muted">No published quizzes are available yet.</div>')+'</div>'}
function renderCerts(){document.querySelector('#certificates').innerHTML='<h2>My Certificates</h2><p class="muted">Completed certificates stored by Pavan Educator.</p><div class="list">'+(certs.length?certs.map(x=>'<div class="item"><div><b>'+esc(x.course_name)+'</b><div class="muted">ID: '+esc(x.certificate_id)+' • '+new Date(x.issued_at).toLocaleDateString()+'</div></div><a class="btn alt" href="verify-certificate.html?id='+encodeURIComponent(x.certificate_id)+'">Verify →</a></div>').join(''):'<div class="muted">Complete eligible courses to receive certificates.</div>')+'</div>'}
function renderTools(){let x=local();document.querySelector('#tools').innerHTML='<h2>My Study Tools</h2><p class="muted">Private browser-based bookmarks, notes and learning goals.</p><h3>Learning Goals</h3><div class="goal"><input id="goalInput" placeholder="Example: Complete AI Fundamentals"><button class="btn" id="addGoal">Add</button></div><div class="list" style="margin-top:10px">'+x.goals.map((g,i)=>'<div class="item"><span>'+esc(g)+'</span><button class="btn alt" onclick="removeGoal('+i+')">Done</button></div>').join('')+'</div><h3>Bookmarked Pages</h3><div class="list">'+(x.bookmarks.length?x.bookmarks.map(b=>'<div class="item"><a href="'+esc(b.url)+'">'+esc(b.title)+'</a><button class="btn alt" onclick="removeBookmark('+b.id+')">Remove</button></div>').join(''):'<div class="muted">Bookmark pages from supported learning screens.</div>')+'</div>' ;document.querySelector('#addGoal').onclick=()=>{const v=document.querySelector('#goalInput').value.trim();if(v){x.goals.push(v);save(x);renderTools()}}}
window.removeGoal=i=>{let x=local();x.goals.splice(i,1);save(x);renderTools()};window.removeBookmark=i=>{let x=local();x.bookmarks=x.bookmarks.filter((_,n)=>n!==i);save(x);renderTools()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab)});
(async()=>{courses=await get('course_catalog?published=eq.true&select=*&order=id.asc');progress=await get('student_learning_progress?username=eq.'+encodeURIComponent(user.username)+'&select=*');quizzes=await get('quizzes?published=eq.true&select=*&order=id.desc');certs=await get('student_certificates?username=eq.'+encodeURIComponent(user.username)+'&select=*&order=issued_at.desc');renderOverview();renderCourses();renderQuizzes();renderCerts();renderTools()})();
</script><script src="assets/platform.js"></script></body></html>
