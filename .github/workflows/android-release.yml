name: Build Pavan Educator Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle
        run: gradle --version

      - name: Build release AAB
        working-directory: android-app
        run: gradle --no-daemon bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pavan-educator-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
