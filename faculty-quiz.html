<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | Faculty Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1150px;margin:auto;padding:30px}.top{background:linear-gradient(110deg,#126df3,#5645f4);color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px}.top h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.card{background:#fff;border:1px solid #e0e7f2;border-radius:15px;padding:22px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d6dfeb;border-radius:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;background:#2474ff;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn.secondary{background:#eef4ff;color:#2474ff}.qitem{border:1px solid #e0e7f2;border-radius:12px;padding:16px;margin-bottom:12px}.qhead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}.list{max-height:550px;overflow:auto}.quizrow{border-bottom:1px solid #edf0f5;padding:14px 0}.quizrow:last-child{border-bottom:0}.muted{color:#718096;font-size:12px}.status{font-size:12px;font-weight:700}.publish{color:#16834b}.draft{color:#c47b00}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><h1>👨‍🏫 Faculty Quiz Manager</h1><p>Create, publish and manage quizzes for Pavan Educator.</p></div><div class="grid">
<section class="card"><h2>Create Quiz</h2><div class="field"><label>Faculty Username</label><input id="faculty" placeholder="Your faculty username"></div><div class="field"><label>Quiz Title</label><input id="title" placeholder="e.g. Python Basics"></div><div class="field"><label>Description</label><textarea id="desc" rows="3"></textarea></div><div class="field"><label>Duration (minutes)</label><input id="duration" type="number" min="1" value="10"></div><div id="questions"></div><button class="btn secondary" onclick="addQuestion()">+ Add Question</button> <button class="btn" onclick="saveQuiz()">Save Quiz</button><p id="msg" class="muted"></p></section>
<section class="card"><h2>My Quizzes</h2><div id="list" class="list">Loading…</div></section></div></main>
<script>
const URL='https://jlrmmkgcjckkayearlca.supabase.co',KEY='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH';let qs=[];
function h(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}async function api(p,o={}){const r=await fetch(URL+'/rest/v1/'+p,{headers:h(),...o});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function addQuestion(){const n=qs.length+1;qs.push(n);document.getElementById('questions').insertAdjacentHTML('beforeend','<div class="qitem" id="q'+n+'"><div class="qhead"><span>Question '+n+'</span><select id="correct'+n+'"><option value="A">Correct: A</option><option value="B">Correct: B</option><option value="C">Correct: C</option><option value="D">Correct: D</option></select></div><div class="field"><input id="text'+n+'" placeholder="Question text"></div><div class="row"><input id="a'+n+'" placeholder="Option A"><input id="b'+n+'" placeholder="Option B"><input id="c'+n+'" placeholder="Option C"><input id="d'+n+'" placeholder="Option D"></div></div>')}
async function saveQuiz(){const faculty=document.getElementById('faculty').value.trim();const title=document.getElementById('title').value.trim();if(!faculty||!title||!qs.length){alert('Enter faculty username, quiz title and at least one question.');return}try{const q=await api('quizzes',{method:'POST',headers:{...h(),'Prefer':'return=representation'},body:JSON.stringify({title,description:document.getElementById('desc').value,duration_minutes:Number(document.getElementById('duration').value)||10,published:false,created_by:faculty})});const quiz=Array.isArray(q)?q[0]:q;const rows=qs.map(n=>({quiz_id:quiz.id,question_no:n,question_text:document.getElementById('text'+n).value,option_a:document.getElementById('a'+n).value,option_b:document.getElementById('b'+n).value,option_c:document.getElementById('c'+n).value,option_d:document.getElementById('d'+n).value,correct_option:document.getElementById('correct'+n).value,marks:1}));await api('quiz_questions',{method:'POST',headers:{...h(),'Prefer':'return=minimal'},body:JSON.stringify(rows)});document.getElementById('msg').textContent='Quiz saved as draft.';document.getElementById('questions').innerHTML='';qs=[];document.getElementById('title').value='';document.getElementById('desc').value='';load()}
async function toggle(id,published){await api('quizzes?id=eq.'+id,{method:'PATCH',headers:h(),body:JSON.stringify({published})});load()}
async function load(){try{const rows=await api('quizzes?select=*&order=created_at.desc');document.getElementById('list').innerHTML=rows.length?rows.map(q=>'<div class="quizrow"><b>'+esc(q.title)+'</b><div class="muted">'+q.duration_minutes+' min • '+(q.published?'<span class="publish">Published</span>':'<span class="draft">Draft</span>')+'</div><button class="btn secondary" onclick="toggle('+q.id+','+(!q.published)+')">'+(q.published?'Unpublish':'Publish')+'</button></div>').join(''):'<p class="muted">No quizzes created yet.</p>'}catch(e){document.getElementById('list').textContent='Could not load quizzes.'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}addQuestion();load();
</script></body></html>
