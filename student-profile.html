<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pavan Educator | My Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9fc;
    color:#172033;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:295px;
    height:100vh;
    background:#071a33;
    color:white;
    padding:30px 25px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:30px;
    font-weight:800;
    padding:5px 5px 55px;
}

.logo span{
    color:#2474ff;
}

.panel-title{
    color:#aeb9cb;
    font-size:17px;
    font-weight:700;
    margin-bottom:25px;
}

.menu{
    list-style:none;
}

.menu li{
    margin-bottom:18px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:18px;
    padding:17px 18px;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
}

.menu a:hover,
.menu a.active{
    background:#2474ff;
}

.menu-icon{
    width:25px;
    text-align:center;
    font-size:24px;
}

.separator{
    height:1px;
    background:#28405f;
    margin-top:15px;
}

.logout{
    margin-top:auto;
}

.logout a{
    display:flex;
    align-items:center;
    gap:15px;
    padding:17px 20px;
    border-radius:10px;
    background:#142b4a;
    color:#ff5252;
    text-decoration:none;
    font-size:18px;
    font-weight:700;
}

.logout a:hover{
    background:#ff5252;
    color:white;
}

/* MAIN */

.main{
    margin-left:295px;
    min-height:100vh;
}

/* TOP BAR */

.topbar{
    height:105px;
    background:white;
    border-bottom:1px solid #e4e9f1;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 45px;
}

.topbar h1{
    font-size:30px;
}

.user-top{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
    font-weight:700;
}

.user-icon{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#2474ff;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;
}

/* CONTENT */

.content{
    padding:40px;
}

.heading{
    margin-bottom:25px;
}

.heading h2{
    font-size:28px;
}

.heading p{
    margin-top:8px;
    color:#64748b;
}

/* PROFILE */

.profile{
    background:white;
    border:1px solid #dce5f2;
    border-radius:18px;
    padding:35px;
    max-width:1000px;
}

.profile-header{
    display:flex;
    align-items:center;
    gap:25px;

    padding-bottom:30px;
    margin-bottom:30px;

    border-bottom:1px solid #e5eaf2;
}

.profile-avatar{
    width:90px;
    height:90px;

    border-radius:50%;

    background:#eaf2ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;
}

.profile-header h2{
    font-size:27px;
}

.profile-header p{
    color:#64748b;
    margin-top:7px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.info{
    background:#f7f9fd;
    border-radius:12px;
    padding:20px;
}

.label{
    color:#64748b;
    font-size:13px;
    margin-bottom:8px;
}

.value{
    font-size:18px;
    font-weight:700;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:13px 22px;
    background:#2474ff;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:700;
}

@media(max-width:800px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 20px;
    }

    .content{
        padding:20px;
    }
}
</style>

</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        Pavan <span>Educator</span>
    </div>

    <div class="panel-title">
        STUDENT PANEL
    </div>

    <ul class="menu">

        <li>
            <a href="student-dashboard.html">
                <span class="menu-icon">🏠</span>
                Dashboard
            </a>
        </li>

        <li>
            <a href="student-projects.html">
                <span class="menu-icon">💻</span>
                My Projects
            </a>
        </li>

        <li>
            <a
                href="student-profile.html"
                class="active"
            >
                <span class="menu-icon">👤</span>
                My Profile
            </a>
        </li>

    </ul>

    <div class="separator"></div>

    <div class="logout">

        <a
            href="login.html"
            onclick="logout()"
        >
            🚪 Logout
        </a>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <h1>
            My Profile
        </h1>

        <div class="user-top">

            <div class="user-icon">
                👤
            </div>

            <span id="topName">
                Student
            </span>

        </div>

    </header>


    <div class="content">

        <div class="heading">

            <h2>
                My Profile
            </h2>

            <p>
                View your personal profile details.
            </p>

        </div>


        <div class="profile">

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>

                <div>

                    <h2 id="profileName">
                        Student
                    </h2>

                    <p>
                        Student Account
                    </p>

                </div>

            </div>


            <div class="info-grid">


                <div class="info">

                    <div class="label">
                        Student Name
                    </div>

                    <div
                        class="value"
                        id="studentName"
                    >
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Username
                    </div>

                    <div
                        class="value"
                        id="studentUsername"
                    >
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Class
                    </div>

                    <div
                        class="value"
                        id="studentClass"
                    >
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Age
                    </div>

                    <div
                        class="value"
                        id="studentAge"
                    >
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Location
                    </div>

                    <div
                        class="value"
                        id="studentLocation"
                    >
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Login Count
                    </div>

                    <div
                        class="value"
                        id="loginCount"
                    >
                        0
                    </div>

                </div>


            </div>

        </div>


        <a
            href="student-dashboard.html"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</main>


<script>

/* GET CURRENT STUDENT */

const username =
    sessionStorage.getItem(
        "currentUser"
    );


const students =
    JSON.parse(
        localStorage.getItem(
            "pavanStudents"
        )
    ) || [];


const student =
    students.find(
        function(item){

            return item.username === username;

        }
    );


/* DISPLAY DATA */
    /* =========================
   DISPLAY CURRENT STUDENT
========================= */

if (!username) {

    alert("Please login first.");

    window.location.href =
        "login.html";

}
else if (!student) {

    alert("Student account not found.");

    window.location.href =
        "login.html";

}
else {

    /* Student name */

    document.getElementById(
        "topName"
    ).textContent =
        student.name;


    document.getElementById(
        "profileName"
    ).textContent =
        student.name;


    document.getElementById(
        "studentName"
    ).textContent =
        student.name;


    /* Username */

    document.getElementById(
        "studentUsername"
    ).textContent =
        student.username;


    /* Class */

    document.getElementById(
        "studentClass"
    ).textContent =
        student.studentClass;


    /* Age */

    document.getElementById(
        "studentAge"
    ).textContent =
        student.age;


    /* Location */

    document.getElementById(
        "studentLocation"
    ).textContent =
        student.location || "-";


    /* Login count */

    const loginData =
        JSON.parse(
            localStorage.getItem(
                "pavanStudentLogins"
            )
        ) || [];


    const loginRecord =
        loginData.find(
            function(item) {

                return (
                    item.username ===
                    student.username
                );

            }
        );


    const count =
        loginRecord
        ? Number(
            loginRecord.loginCount || 0
        )
        : 0;


    document.getElementById(
        "loginCount"
    ).textContent =
        count;

}


/* =========================
   LOGOUT
========================= */

function logout() {

    sessionStorage.clear();

}

if(student){

    document.getElementById(
        "topName"
    ).textContent =
        student.name;


    document.getElementById(
        "profileName"
    ).textContent =
        student.name;


    document.getElementById(
        "studentName"
    ).textContent =
        student.name;


    document.getElementById(
        "studentUsername"
    ).textContent =
        student.username;


    document.getElementById(
        "studentClass"
    ).textContent =
        student.studentClass;


    document.getElementById(
        "studentAge"
    ).textContent =
        student.age;


    document.getElementById(
        "studentLocation"
    ).textContent =
        student.location || "-";


    /* LOGIN COUNT */

    const loginData =
        JSON.parse(
            localStorage.getItem(
                "pavanStudentLogins"
            )
        ) || [];


    const login =
        loginData.find(
            function(item){

                return item.username
                    === student.username;

            }
        );


    document.getElementById(
        "loginCount"
    ).textContent =
        login
        ? login.loginCount
        : 0;

}


/* LOGOUT */

function logout(){

    sessionStorage.clear();

}

</script>

</body>
</html>
