<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings | Pavan Educator</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/upgrade.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f8ff;color:#172033}.wrap{max-width:760px;margin:70px auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf3;border-radius:18px;padding:30px;box-shadow:0 12px 35px rgba(23,32,51,.08)}.top{display:flex;align-items:center;gap:12px;margin-bottom:25px}.top img{width:55px;height:55px}.top a{margin-left:auto;text-decoration:none;color:#2563eb;font-weight:700}.row{margin:18px 0}.row label{display:block;font-weight:700;margin-bottom:7px}.row input,.row select{width:100%;padding:12px;border:1px solid #d5ddec;border-radius:9px;box-sizing:border-box}.btn{background:#2563eb;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.msg{margin-top:15px;color:#15803d;font-weight:700}</style></head><body><div class="wrap"><div class="card"><div class="top"><img src="assets/logo.svg" alt="Pavan Educator"><strong>Pavan Educator</strong><a href="index.html">Home</a></div><h1>Settings</h1><p>Manage basic website preferences.</p><form id="settingsForm"><div class="row"><label for="theme">Theme</label><select id="theme"><option value="light">Light</option><option value="system">System</option></select></div><div class="row"><label for="name">Display name</label><input id="name" placeholder="Pavan Educator"></div><button class="btn">Save Settings</button><div id="msg" class="msg"></div></form></div></div><script>const theme=document.getElementById('theme'),name=document.getElementById('name');theme.value=localStorage.getItem('pe_theme')||'light';name.value=localStorage.getItem('pe_name')||'Pavan Educator';document.getElementById('settingsForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('pe_theme',theme.value);localStorage.setItem('pe_name',name.value.trim()||'Pavan Educator');document.getElementById('msg').textContent='Settings saved successfully.'});</script></body></html>
