<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | Course Content</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;height:100vh;overflow-y:auto;background:#071a33;color:#fff;padding:25px 18px}.logo{font-size:25px;font-weight:800;padding:8px 10px 32px}.logo span{color:#4d8dff}.menu{list-style:none;padding:0}.menu li{margin:6px 0}.menu a{display:block;padding:12px 14px;border-radius:9px;color:#c9d2e3;text-decoration:none;font-weight:700;font-size:14px}.menu a:hover,.menu a.active{background:#2563eb;color:#fff}.main{margin-left:250px;min-height:100vh}.top{height:76px;background:#fff;border-bottom:1px solid #e2e8f2;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top h1{font-size:23px}.back{color:#2563eb;text-decoration:none;font-weight:700}.content{padding:28px}.hero{background:linear-gradient(110deg,#126df3,#5645f4);color:#fff;border-radius:16px;padding:25px;margin-bottom:22px}.hero small{font-weight:800;opacity:.85}.hero h2{margin:8px 0}.tabs{display:flex;gap:9px;margin-bottom:18px}.tab{border:1px solid #d6dfed;background:#fff;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}.panel{display:none}.panel.active{display:block}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.add{border:0;background:#2563eb;color:#fff;padding:10px 15px;border-radius:8px;font-weight:800;cursor:pointer}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid #e1e7f2;border-radius:12px;padding:16px;display:flex;justify-content:space-between;gap:15px}.item h3{margin:0 0 6px;font-size:16px}.meta{font-size:12px;color:#718096}.actions button{border:0;border-radius:7px;padding:8px 11px;font-weight:700;cursor:pointer}.edit{background:#eaf1ff;color:#2563eb}.del{background:#fff0f0;color:#d33}.empty{background:#fff;border:1px solid #e1e7f2;padding:35px;text-align:center;border-radius:12px;color:#718096}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(580px,100%);background:#fff;border-radius:16px;padding:24px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d5deec;border-radius:8px;font:inherit}.field textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions2{display:flex;gap:10px}.actions2 button{flex:1;padding:11px;border-radius:8px;font-weight:800;border:0}.cancel{background:#edf1f7}.save{background:#2563eb;color:#fff}@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0}.row{grid-template-columns:1fr}.top{padding:0 15px}.content{padding:16px}.item{flex-direction:column}}</style></head><body>
<aside class="sidebar"><div class="logo">Pavan <span>Educator</span></div><ul class="menu"><li><a href="admin-dashboard.html">🏠 Dashboard</a></li><li><a href="admin-courses.html" class="active">📚 Courses</a></li><li><a href="admin-projects.html">💻 Projects</a></li><li><a href="admin-videos.html">🎥 Videos</a></li><li><a href="admin-students.html">🎓 Students</a></li><li><a href="admin-attendance.html">📋 Attendance</a></li><li><a href="admin-chat.html">💬 Student Chat</a></li><li><a href="admin-settings.html">⚙️ Settings</a></li></ul></aside>
<main class="main"><header class="top"><div><h1>Course Content Manager</h1><div id="sub" style="color:#718096;font-size:13px">Loading…</div></div><a class="back" href="admin-courses.html">← Courses</a></header><div class="content"><section class="hero"><small>STRUCTURED LEARNING</small><h2 id="title">Course</h2><div id="desc"></div></section><div class="tabs"><button class="tab active" data-p="lessons">📘 Chapters & Lessons</button><button class="tab" data-p="videos">🎥 Videos</button><button class="tab" data-p="materials">📖 Study Materials</button></div>
<section id="lessons" class="panel active"><div class="bar"><h3>Lessons</h3><button class="add" onclick="openModal('lesson')">+ Add Lesson</button></div><div id="lessonList" class="list"></div></section>
<section id="videos" class="panel"><div class="bar"><h3>Videos</h3><button class="add" onclick="openModal('video')">+ Add Video</button></div><div id="videoList" class="list"></div></section>
<section id="materials" class="panel"><div class="bar"><h3>Study Materials</h3><button class="add" onclick="openModal('material')">+ Add Material</button></div><div id="materialList" class="list"></div></section></div></main>
<div class="modal" id="modal"><div class="box"><h2 id="mt">Add Content</h2><form onsubmit="save(event)"><div class="field"><label>Title</label><input id="fTitle" required></div><div class="row"><div class="field" id="chapterField"><label>Chapter No.</label><input id="fChapter" type="number" min="1" value="1"></div><div class="field"><label>Lesson No.</label><input id="fNo" type="number" min="1" value="1"></div><div class="field"><label>Published</label><select id="fPublished"><option value="true">Published</option><option value="false">Draft</option></select></div></div><div class="field" id="urlField"><label>URL</label><input id="fUrl" type="url" placeholder="https://..."></div><div class="field"><label>Description / Content</label><textarea id="fDesc"></textarea></div><div class="actions2"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="save">Save</button></div></form></div></div>
<script>
const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};let course,mode,editId=null;
function guard(){if(sessionStorage.getItem('adminLoggedIn')!=='true'||sessionStorage.getItem('currentRole')!=='Admin'){location.href='login.html';return false}return true}
async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{headers:{...H,...(opt.headers||{})},...opt});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){if(!guard())return;const id=new URLSearchParams(location.search).get('id');if(!id){location.href='admin-courses.html';return}const rows=await api('course_catalog?id=eq.'+id+'&select=*');course=rows[0];if(!course){alert('Course not found');location.href='admin-courses.html';return}title.textContent=course.course_name;sub.textContent=(course.class_name||'All Classes')+' • '+(course.subject||'General');desc.textContent=course.description||'';await load()}
async function load(){const [l,v,m]=await Promise.all([api('course_lessons?course_id=eq.'+course.id+'&select=*&order=lesson_no.asc'),api('course_videos?course_id=eq.'+course.id+'&select=*&order=lesson_no.asc'),api('digital_library?course_id=eq.'+course.id+'&select=*&order=id.asc')]);render('lessonList',l,'lesson');render('videoList',v,'video');render('materialList',m,'material')}
function render(id,rows,type){document.getElementById(id).innerHTML=rows.length?rows.map(x=>'<article class="item"><div><h3>'+esc(x.title)+'</h3><div class="meta">'+(type==='lesson'?'Lesson '+esc(x.lesson_no):type==='video'?'Lesson '+esc(x.lesson_no||'—')+' • '+esc(x.duration||'Video'):esc(x.category||'Material'))+' • '+(x.published?'Published':'Draft')+'</div></div><div class="actions"><button class="del" onclick="removeItem('+x.id+',\''+type+'\')">Delete</button></div></article>').join(''):'<div class="empty">No '+type+' content yet.</div>'}
function openModal(t,id){mode=t;editId=id||null;document.getElementById('mt').textContent='Add '+(t==='lesson'?'Lesson':t==='video'?'Video':'Study Material');document.getElementById('fTitle').value='';document.getElementById('fChapter').value=1;document.getElementById('fNo').value=1;document.getElementById('chapterField').style.display=t==='material'?'none':'';document.getElementById('fUrl').value='';document.getElementById('fDesc').value='';document.getElementById('fPublished').value='true';document.getElementById('fNo').previousElementSibling.textContent=t==='material'?'Category / Type':'Lesson No.';document.getElementById('urlField').querySelector('label').textContent=t==='lesson'?'Video URL / optional':'URL';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function save(e){e.preventDefault();const title=document.getElementById('fTitle').value.trim(),chapter=Number(document.getElementById('fChapter').value)||1,no=Number(document.getElementById('fNo').value)||1,url=document.getElementById('fUrl').value.trim(),desc=document.getElementById('fDesc').value.trim(),published=document.getElementById('fPublished').value==='true';try{let body;if(mode==='lesson')body={course_id:course.id,chapter_no:chapter,lesson_no:no,title,content:desc,video_url:url,published};if(mode==='video')body={course_id:course.id,lesson_no:no,title,description:desc,video_url:url,published};if(mode==='material')body={course_id:course.id,title,description:desc,category:document.getElementById('fNo').value||'Notes',file_url:url,file_type:'document',published};await api(mode==='lesson'?'course_lessons':mode==='video'?'course_videos':'digital_library',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});closeModal();await load()}catch(err){alert('Could not save content: '+err.message)}}
async function removeItem(id,t){if(!confirm('Delete this item?'))return;try{await api((t==='lesson'?'course_lessons':t==='video'?'course_videos':'digital_library')+'?id=eq.'+id,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}});await load()}catch(e){alert('Could not delete item: '+e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});
init();
</script><script src="assets/page-transition.js?v=20261001"></script><script src="assets/admin-sidebar.js?v=20261006-1"></script></body></html>
