<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="assets/pavan-logo.svg"><title>Pavan Educator | Course</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8ff;color:#172033}.nav{height:74px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:10}.logo{font-size:23px;font-weight:800;text-decoration:none;color:#172033}.logo span{color:#2563eb}.nav-right{display:flex;gap:15px;align-items:center}.back{color:#2563eb;text-decoration:none;font-weight:700;font-size:13px}.portal{background:#2563eb;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:800}
.wrap{max-width:1080px;margin:auto;padding:32px 20px 70px}.hero{background:linear-gradient(110deg,#126df3,#5645f4);color:#fff;border-radius:18px;padding:30px;margin-bottom:22px}.hero small{font-weight:800;letter-spacing:1px;opacity:.85}.hero h1{margin:8px 0;font-size:34px}.hero p{opacity:.9;line-height:1.6;max-width:760px}.progress{height:9px;background:rgba(255,255,255,.25);border-radius:20px;overflow:hidden;margin-top:18px}.fill{height:100%;background:#fff;border-radius:20px}.pct{font-size:12px;margin-top:8px;opacity:.9}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #d7e1ee;background:#fff;color:#526177;padding:11px 16px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}.tab.active,.tab:hover{background:#2563eb;color:#fff;border-color:#2563eb}
.section{display:none}.section.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 0 13px}.section-head h2{font-size:20px}.section-head p{font-size:12px;color:#718096;margin-top:4px}
.lesson,.resource{background:#fff;border:1px solid #e0e7f2;border-radius:14px;padding:21px;margin-bottom:12px}.lesson{display:grid;grid-template-columns:48px 1fr auto;gap:15px;align-items:start}.num{width:42px;height:42px;border-radius:12px;background:#eef4ff;color:#2563eb;display:grid;place-items:center;font-weight:800}.lesson h3,.resource h3{margin:0 0 7px;font-size:16px}.lesson p,.resource p{color:#65738a;line-height:1.65;font-size:13px;white-space:pre-line}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-block;border:0;border-radius:8px;background:#2563eb;color:#fff;padding:9px 12px;text-decoration:none;font-size:11px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef4ff;color:#2563eb}.done{border-color:#8cc9a9}.done-label{display:block;color:#16834b;font-size:11px;font-weight:800;margin-top:7px}.empty{text-align:center;background:#fff;border:1px solid #e0e7f2;padding:40px;border-radius:14px;color:#718096}.empty strong{display:block;color:#172033;font-size:18px;margin-bottom:6px}.count{font-size:11px;color:#718096}
@media(max-width:700px){.nav{padding:0 5%}.portal{display:none}.hero h1{font-size:28px}.lesson{grid-template-columns:42px 1fr}.lesson .actions{grid-column:2;justify-content:flex-start}.section-head{display:block}}
</style>
<script src="data/demo-students.js?v=20261001"></script><script src="data/demo-auth.js?v=20261001-attendance"></script>
</head><body>
<header class="nav"><a class="logo" href="index.html">Pavan <span>Educator</span></a><div class="nav-right"><a class="back" id="back" href="courses.html">← All Courses</a><a class="portal" href="login.html">Student Portal</a></div></header>
<main class="wrap">
<section id="hero" class="hero"><small id="subject">COURSE</small><h1 id="title">Loading…</h1><p id="desc"></p><div class="progress"><div id="fill" class="fill" style="width:0"></div></div><div id="pct" class="pct">Loading progress…</div></section>
<nav class="tabs" aria-label="Course sections"><button class="tab active" data-tab="lessons">📚 Chapters & Lessons</button><button class="tab" data-tab="videos">🎥 Videos</button><button class="tab" data-tab="materials">📖 Study Materials</button></nav>
<section id="lessons" class="section active"></section><section id="videos" class="section"></section><section id="materials" class="section"></section>
</main>
<script>
const U='https://jlrmmkgcjckkayearlca.supabase.co',K='sb_publishable_eEPceWmh6MUHLwZmAQMEdQ_uk1Gp1EH',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
let course,lessons=[],videos=[],materials=[],student;
async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{headers:{...H,...(opt.headers||{})},...opt});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safeUrl(v){try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
async function init(){
 student=window.PavanDemoAuth&&PavanDemoAuth.current();
 const id=new URLSearchParams(location.search).get('id');
 if(!id){showEmpty('lessons','Course not found.');return}
 try{
  const cs=await api('course_catalog?id=eq.'+encodeURIComponent(id)+'&published=eq.true&select=*');course=cs[0];if(!course)throw Error('not found');
  document.title='Pavan Educator | '+course.course_name;document.getElementById('title').textContent=course.course_name;document.getElementById('subject').textContent=(course.subject||course.category||'COURSE').toUpperCase();document.getElementById('desc').textContent=course.description||'Structured learning path with lessons and study resources.';
  const back=document.getElementById('back');back.href='courses.html'+(course.class_name&&course.class_name!=='All Classes'?'?class='+encodeURIComponent(course.class_name)+'&subject='+encodeURIComponent(course.subject||''):'');
  [lessons,videos,materials]=await Promise.all([
   api('course_lessons?course_id=eq.'+id+'&published=eq.true&select=*&order=lesson_no.asc'),
   api('course_videos?course_id=eq.'+id+'&published=eq.true&select=*&order=lesson_no.asc,id.asc'),
   api('digital_library?course_id=eq.'+id+'&published=eq.true&select=*&order=created_at.desc')
  ]);
  await renderProgress();renderLessons();renderVideos();renderMaterials();
 }catch(e){console.error(e);showEmpty('lessons','This course could not be loaded.')}
}
async function renderProgress(){
 if(!student){document.getElementById('pct').textContent='Sign in to save your course progress.';return}
 try{const p=await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name)+'&select=*');const done=Number(p[0]?.completed_lessons||0),total=Math.max(lessons.length,1),percent=Math.round(done/total*100);document.getElementById('fill').style.width=percent+'%';document.getElementById('pct').textContent=done+' of '+lessons.length+' lessons completed • '+percent+'%';}
 catch(e){document.getElementById('pct').textContent='Progress is temporarily unavailable.'}
}
function renderLessons(){
 const box=document.getElementById('lessons');if(!lessons.length){showEmpty('lessons','No chapters or lessons have been published for this course yet.');return}
 box.innerHTML='<div class="section-head"><div><h2>Chapters & Lessons</h2><p>Follow the course in order and mark each lesson complete.</p></div><span class="count">'+lessons.length+' lesson'+(lessons.length===1?'':'s')+'</span></div>'+lessons.map((x,i)=>'<article class="lesson" id="lesson-'+x.id+'"><div class="num">'+esc(x.lesson_no||i+1)+'</div><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.content||'Lesson content will be available soon.')+'</p></div><div class="actions">'+(x.video_url?'<a class="btn" target="_blank" rel="noopener" href="'+safeUrl(x.video_url)+'">▶ Video</a>':'')+(x.material_url?'<a class="btn secondary" target="_blank" rel="noopener" href="'+safeUrl(x.material_url)+'">📖 Material</a>':'')+(student?'<button class="btn secondary" onclick="completeLesson('+x.lesson_no+')">✓ Mark Complete</button>':'')+'</div></article>').join('');
}
function renderVideos(){
 const box=document.getElementById('videos');if(!videos.length){showEmpty('videos','No course videos have been published yet. Videos added by the educator will appear here.');return}
 box.innerHTML='<div class="section-head"><div><h2>Video Lectures</h2><p>Watch videos connected to this course.</p></div><span class="count">'+videos.length+' video'+(videos.length===1?'':'s')+'</span></div>'+videos.map((x,i)=>'<article class="resource"><h3>🎥 '+esc(x.title||'Video '+(i+1))+'</h3><p>'+esc(x.description||'Course video lecture.')+'</p><div class="actions" style="margin-top:12px;justify-content:flex-start"><a class="btn" target="_blank" rel="noopener" href="'+safeUrl(x.video_url)+'">Watch Video →</a><span class="count">'+esc(x.duration||'')+'</span></div></article>').join('');
}
function renderMaterials(){
 const box=document.getElementById('materials');if(!materials.length){showEmpty('materials','No study materials have been linked to this course yet. Notes and PDFs added by the educator will appear here.');return}
 box.innerHTML='<div class="section-head"><div><h2>Study Materials</h2><p>Open notes, PDFs and other resources for this course.</p></div><span class="count">'+materials.length+' material'+(materials.length===1?'':'s')+'</span></div>'+materials.map((x,i)=>'<article class="resource"><h3>📖 '+esc(x.title||'Study Material '+(i+1))+'</h3><p>'+esc(x.description||'Course study material.')+'</p><div class="actions" style="margin-top:12px;justify-content:flex-start"><a class="btn" target="_blank" rel="noopener" href="'+safeUrl(x.file_url)+'">Open Material →</a><span class="count">'+esc(x.file_type||'PDF')+'</span></div></article>').join('');
}
function showEmpty(id,msg){document.getElementById(id).innerHTML='<div class="empty"><strong>'+esc(msg.split('.')[0])+'</strong>'+esc(msg.split('.').slice(1).join('.'))+'</div>'}
async function completeLesson(no){
 if(!student)return;
 try{
  const rows=await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name)+'&select=*');
  const current=Number(rows[0]?.completed_lessons||0),next=Math.min(Math.max(current,no?1:0),lessons.length);
  const body={username:student.username,course_name:course.course_name,completed_lessons:Math.max(current,next),total_lessons:lessons.length,percent:Math.round(Math.max(current,next)/Math.max(lessons.length,1)*100),last_activity:new Date().toISOString()};
  if(rows[0]) await api('student_learning_progress?username=eq.'+encodeURIComponent(student.username)+'&course_name=eq.'+encodeURIComponent(course.course_name),{method:'PATCH',body:JSON.stringify(body)});
  else await api('student_learning_progress',{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(body)});
  await renderProgress();
 }catch(e){alert('Progress could not be saved right now.')}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}));
init();
</script><script src="assets/page-transition.js?v=20261001"></script></body></html>
