<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pavan Educator | Manage Projects</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fc;
    color: #172033;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 250px;
    height: 100vh;

    background: #111a2e;
    color: white;

    padding: 25px 18px;
}

.logo {
    padding: 10px 12px 30px;

    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #4d8dff;
}

.admin-label {
    color: #8e9bb3;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1px;

    padding: 0 12px 12px;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 7px;
}

.menu a {
    display: flex;

    align-items: center;

    gap: 13px;

    padding: 13px 14px;

    color: #c9d2e3;

    text-decoration: none;

    border-radius: 9px;

    font-size: 14px;

    font-weight: 600;

    transition: .2s;
}

.menu a:hover,
.menu a.active {
    background: #2563eb;

    color: white;
}

.menu-icon {
    width: 24px;

    text-align: center;
}

.logout {
    position: absolute;

    bottom: 25px;

    left: 18px;

    right: 18px;
}

.logout a {
    display: block;

    text-align: center;

    padding: 12px;

    border-radius: 9px;

    background: #1c2944;

    color: #c9d2e3;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;
}

.logout a:hover {
    background: #dc3545;

    color: white;
}

/* ================= MAIN ================= */

.main {
    margin-left: 250px;

    min-height: 100vh;
}

/* ================= TOPBAR ================= */

.topbar {
    height: 75px;

    background: white;

    border-bottom:
        1px solid #e2e8f2;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 35px;
}

.page-title h1 {
    font-size: 23px;
}

.page-title p {
    color: #7a869b;

    font-size: 13px;

    margin-top: 4px;
}

.back-link {
    text-decoration: none;

    color: #2563eb;

    font-weight: 700;

    font-size: 14px;
}

/* ================= CONTENT ================= */

.content {
    padding: 35px;
}

/* ================= HEADER ================= */

.page-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.page-header h2 {
    font-size: 28px;
}

.page-header p {
    color: #7a869b;

    margin-top: 6px;

    font-size: 14px;
}

.add-btn {
    border: none;

    background: #2563eb;

    color: white;

    padding: 13px 20px;

    border-radius: 9px;

    font-weight: 700;

    cursor: pointer;
}

.add-btn:hover {
    background: #1d4ed8;
}

/* ================= SEARCH ================= */

.search-box {
    width: 100%;

    height: 52px;

    background: white;

    border:
        1px solid #dce4f0;

    border-radius: 10px;

    padding: 0 18px;

    font-size: 14px;

    outline: none;

    margin-bottom: 25px;
}

.search-box:focus {
    border-color: #2563eb;
}

/* ================= PROJECT GRID ================= */

.project-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}

.project-card {
    background: white;

    border:
        1px solid #e1e7f2;

    border-radius: 15px;

    overflow: hidden;

    transition: .2s;
}

.project-card:hover {
    transform:
        translateY(-4px);

    box-shadow:
        0 14px 35px
        rgba(30,70,140,.08);
}

.project-icon {
    height: 140px;

    background:
        linear-gradient(
            135deg,
            #e9f0ff,
            #f7faff
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 58px;
}

.project-info {
    padding: 22px;
}

.project-category {
    color: #2563eb;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1px;
}

.project-info h3 {
    margin: 10px 0;

    font-size: 20px;
}

.project-info p {
    color: #687389;

    font-size: 13px;

    line-height: 1.6;
}

.technologies {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 15px;
}

.tech {
    background: #edf3ff;

    color: #2563eb;

    padding: 6px 9px;

    border-radius: 6px;

    font-size: 11px;

    font-weight: 700;
}

.project-links {
    display: flex;

    gap: 9px;

    margin-top: 18px;
}

.project-links a {
    flex: 1;

    text-align: center;

    padding: 10px 5px;

    border-radius: 7px;

    text-decoration: none;

    font-size: 12px;

    font-weight: 700;
}

.view-link {
    background: #2563eb;

    color: white;
}

.source-link {
    background: #edf3ff;

    color: #2563eb;
}

.project-actions {
    display: flex;

    gap: 9px;

    margin-top: 12px;
}

.edit-btn,
.delete-btn {
    flex: 1;

    border: none;

    padding: 10px;

    border-radius: 7px;

    cursor: pointer;

    font-weight: 700;
}

.edit-btn {
    background: #eaf1ff;

    color: #2563eb;
}

.delete-btn {
    background: #fff0f0;

    color: #dc3545;
}

/* ================= MODAL ================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(10,20,40,.55);

    align-items: center;

    justify-content: center;

    z-index: 2000;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 560px;

    max-height: 90vh;

    overflow-y: auto;

    background: white;

    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.2);
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 23px;
}

.close-btn {
    border: none;

    background: #f0f3f8;

    width: 35px;

    height: 35px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;

    border:
        1px solid #d5deec;

    border-radius: 8px;

    padding: 12px;

    font-family: inherit;

    outline: none;
}

.form-group textarea {
    height: 90px;

    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #2563eb;
}

.form-actions {
    display: flex;

    gap: 10px;

    margin-top: 22px;
}

.cancel-btn,
.save-btn {
    flex: 1;

    padding: 12px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 700;
}

.cancel-btn {
    border:
        1px solid #d5deec;

    background: white;

    color: #687389;
}

.save-btn {
    border: none;

    background: #2563eb;

    color: white;
}

/* ================= EMPTY ================= */

.empty {
    background: white;

    border:
        1px solid #e1e7f2;

    border-radius: 15px;

    padding: 50px;

    text-align: center;

    color: #7a869b;

    grid-column: 1 / -1;
}

.empty-icon {
    font-size: 45px;

    margin-bottom: 12px;
}

/* ================= MOBILE ================= */

@media(max-width:1000px) {

    .sidebar {
        width: 210px;
    }

    .main {
        margin-left: 210px;
    }

    .project-grid {
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:700px) {

    .sidebar {
        position: relative;

        width: 100%;

        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .logout {
        position: relative;

        left: auto;

        right: auto;

        bottom: auto;

        margin-top: 20px;
    }

    .topbar {
        padding: 0 20px;
    }

    .content {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }

    .project-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">


    <div class="logo">

        Pavan <span>Educator</span>

    </div>


    <div class="admin-label">
        ADMIN PANEL
    </div>


    <ul class="menu">


        <li>

            <a href="admin-dashboard.html">

                <span class="menu-icon">
                    🏠
                </span>

                Dashboard

            </a>

        </li>


        <li>

            <a href="admin-courses.html">

                <span class="menu-icon">
                    📚
                </span>

                Courses

            </a>

        </li>


        <li>

            <a
                href="admin-projects.html"
                class="active"
            >

                <span class="menu-icon">
                    💻
                </span>

                Projects

            </a>

        </li>


        <li>

            <a href="admin-videos.html">

                <span class="menu-icon">
                    🎥
                </span>

                Videos

            </a>

        </li>


        <li>

            <a href="admin-students.html">

                <span class="menu-icon">
                    🎓
                </span>

                Students

            </a>

        </li>


        <li>

            <a href="admin-settings.html">

                <span class="menu-icon">
                    ⚙️
                </span>

                Settings

            </a>

        </li>


    </ul>


    <div class="logout">

        <a
            href="login.html"
            onclick="logout()"
        >

            🚪 Logout

        </a>

    </div>


</aside>


<!-- ================= MAIN ================= -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">


        <div class="page-title">

            <h1>
                Project Management
            </h1>

            <p>
                Add and manage your projects
            </p>

        </div>


        <a
            href="admin-dashboard.html"
            class="back-link"
        >

            ← Dashboard

        </a>


    </header>


    <!-- CONTENT -->

    <div class="content">


        <!-- HEADER -->

        <div class="page-header">


            <div>

                <h2>
                    Projects
                </h2>

                <p>
                    Create, edit and remove projects.
                </p>

            </div>


            <button
                class="add-btn"
                onclick="openAddModal()"
            >

                + Add Project

            </button>


        </div>


        <!-- SEARCH -->

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search projects..."
            onkeyup="renderProjects()"
        >


        <!-- PROJECT GRID -->

        <div
            class="project-grid"
            id="projectGrid"
        ></div>


    </div>

</main>


<!-- ================= MODAL ================= -->

<div
    class="modal"
    id="projectModal"
>


    <div class="modal-box">


        <div class="modal-header">


            <h2 id="modalTitle">
                Add Project
            </h2>


            <button
                class="close-btn"
                onclick="closeModal()"
            >

                ×

            </button>


        </div>


        <form onsubmit="saveProject(event)">


            <div class="form-group">

                <label>
                    Project Name
                </label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="Example: Attendance Management System"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select id="projectCategory">

                    <option>
                        Web Application
                    </option>

                    <option>
                        Website
                    </option>

                    <option>
                        Student System
                    </option>

                    <option>
                        Application
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="projectDescription"
                    placeholder="Enter project description..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Technologies
                </label>

                <input
                    type="text"
                    id="projectTechnologies"
                    placeholder="HTML, CSS, JavaScript"
                >

            </div>


            <div class="form-group">

                <label>
                    Project Link
                </label>

                <input
                    type="url"
                    id="projectLink"
                    placeholder="https://example.com"
                >

            </div>


            <div class="form-group">

                <label>
                    GitHub Link
                </label>

                <input
                    type="url"
                    id="githubLink"
                    placeholder="https://github.com/..."
                >

            </div>


            <div class="form-group">

                <label>
                    Icon / Emoji
                </label>

                <input
                    type="text"
                    id="projectIcon"
                    placeholder="💻"
                    maxlength="4"
                >

            </div>


            <div class="form-actions">


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >

                    Cancel

                </button>


                <button
                    type="submit"
                    class="save-btn"
                >

                    Save Project

                </button>


            </div>


        </form>


    </div>

</div>


<script>


/* ================= DEFAULT PROJECTS ================= */

const defaultProjects = [

    {
        name:
            "Attendance Management System",

        category:
            "Web Application",

        description:
            "A complete attendance management system with student records, attendance entry, reports and dashboard features.",

        technologies:
            "HTML, CSS, JavaScript",

        projectLink:
            "",

        githubLink:
            "",

        icon:
            "📊"
    },


    {
        name:
            "Student Result System",

        category:
            "Student System",

        description:
            "A student result management application for marks, grades and academic performance.",

        technologies:
            "HTML, CSS, JavaScript",

        projectLink:
            "",

        githubLink:
            "",

        icon:
            "🎓"
    },


    {
        name:
            "Student Management System",

        category:
            "Web Application",

        description:
            "A system designed to manage student information and academic records.",

        technologies:
            "HTML, CSS, JavaScript",

        projectLink:
            "",

        githubLink:
            "",

        icon:
            "💻"
    },


    {
        name:
            "Educational Website",

        category:
            "Website",

        description:
            "A responsive educational website for sharing courses and learning resources.",

        technologies:
            "HTML, CSS, JavaScript",

        projectLink:
            "",

        githubLink:
            "",

        icon:
            "🌐"
    }

];


/* ================= LOAD PROJECTS ================= */

let projects =
    JSON.parse(
        localStorage.getItem(
            "pavanProjects"
        )
    );


if (
    !projects ||
    projects.length === 0
) {

    projects =
        defaultProjects;

    saveProjects();

}


/* ================= EDIT INDEX ================= */

let editingIndex = -1;


/* ================= SAVE ================= */

function saveProjects() {

    localStorage.setItem(
        "pavanProjects",
        JSON.stringify(projects)
    );

}


/* ================= RENDER ================= */

function renderProjects() {


    const grid =
        document.getElementById(
            "projectGrid"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    grid.innerHTML = "";


    const filtered =
        projects.filter(
            function(project) {

                return (

                    project.name
                    .toLowerCase()
                    .includes(search)

                    ||

                    project.category
                    .toLowerCase()
                    .includes(search)

                    ||

                    project.technologies
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    if (
        filtered.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💻
                </div>

                <h3>
                    No projects found
                </h3>

                <p>
                    Try another search or add a new project.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(project) {


            const realIndex =
                projects.indexOf(
                    project
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "project-card";


            let technologiesHTML = "";


            if (
                project.technologies
            ) {

                const techs =
                    project
                    .technologies
                    .split(",");


                technologiesHTML =
                    techs
                    .map(
                        function(tech) {

                            return `
                                <span class="tech">
                                    ${escapeHTML(
                                        tech.trim()
                                    )}
                                </span>
                            `;

                        }
                    )
                    .join("");

            }


            let linksHTML = "";


            if (
                project.projectLink
            ) {

                linksHTML += `

                    <a
                        href="${escapeAttribute(
                            project.projectLink
                        )}"
                        target="_blank"
                        class="view-link"
                    >
                        🌐 View
                    </a>

                `;

            }


            if (
                project.githubLink
            ) {

                linksHTML += `

                    <a
                        href="${escapeAttribute(
                            project.githubLink
                        )}"
                        target="_blank"
                        class="source-link"
                    >
                        💻 GitHub
                    </a>

                `;

            }


            if (
                linksHTML === ""
            ) {

                linksHTML = `

                    <a
                        href="#"
                        class="view-link"
                        onclick="noLink(event)"
                    >
                        🌐 View
                    </a>

                `;

            }


            card.innerHTML = `

                <div class="project-icon">
                    ${project.icon || "💻"}
                </div>


                <div class="project-info">


                    <div class="project-category">
                        ${escapeHTML(
                            project.category
                        )}
                    </div>


                    <h3>
                        ${escapeHTML(
                            project.name
                        )}
                    </h3>


                    <p>
                        ${escapeHTML(
                            project.description
                        )}
                    </p>


                    <div class="technologies">

                        ${technologiesHTML}

                    </div>


                    <div class="project-links">

                        ${linksHTML}

                    </div>


                    <div class="project-actions">


                        <button
                            class="edit-btn"
                            onclick="editProject(
                                ${realIndex}
                            )"
                        >

                            ✏️ Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteProject(
                                ${realIndex}
                            )"
                        >

                            🗑️ Delete

                        </button>


                    </div>


                </div>

            `;


            grid.appendChild(card);


        }
    );

}


/* ================= ADD ================= */

function openAddModal() {


    editingIndex = -1;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Project";


    document.getElementById(
        "projectName"
    ).value = "";


    document.getElementById(
        "projectCategory"
    ).value =
        "Web Application";


    document.getElementById(
        "projectDescription"
    ).value = "";


    document.getElementById(
        "projectTechnologies"
    ).value = "";


    document.getElementById(
        "projectLink"
    ).value = "";


    document.getElementById(
        "githubLink"
    ).value = "";


    document.getElementById(
        "projectIcon"
    ).value = "";


    document.getElementById(
        "projectModal"
    ).classList.add("show");

}


/* ================= EDIT ================= */

function editProject(index) {


    const project =
        projects[index];


    editingIndex = index;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Project";


    document.getElementById(
        "projectName"
    ).value =
        project.name;


    document.getElementById(
        "projectCategory"
    ).value =
        project.category;


    document.getElementById(
        "projectDescription"
    ).value =
        project.description;


    document.getElementById(
        "projectTechnologies"
    ).value =
        project.technologies;


    document.getElementById(
        "projectLink"
    ).value =
        project.projectLink;


    document.getElementById(
        "githubLink"
    ).value =
        project.githubLink;


    document.getElementById(
        "projectIcon"
    ).value =
        project.icon;


    document.getElementById(
        "projectModal"
    ).classList.add("show");

}


/* ================= SAVE PROJECT ================= */

function saveProject(event) {


    event.preventDefault();


    const project = {


        name:
            document.getElementById(
                "projectName"
            ).value.trim(),


        category:
            document.getElementById(
                "projectCategory"
            ).value,


        description:
            document.getElementById(
                "projectDescription"
            ).value.trim(),


        technologies:
            document.getElementById(
                "projectTechnologies"
            ).value.trim(),


        projectLink:
            document.getElementById(
                "projectLink"
            ).value.trim(),


        githubLink:
            document.getElementById(
                "githubLink"
            ).value.trim(),


        icon:
            document.getElementById(
                "projectIcon"
            ).value.trim()
            || "💻"

    };


    const wasEditing =
        editingIndex !== -1;


    if (
        editingIndex === -1
    ) {

        projects.push(
            project
        );

    }

    else {

        projects[
            editingIndex
        ] = project;

    }


    saveProjects();

    closeModal();

    renderProjects();


    alert(
        wasEditing
        ? "Project updated successfully!"
        : "Project added successfully!"
    );

}


/* ================= DELETE ================= */

function deleteProject(index) {


    const project =
        projects[index];


    const confirmed =
        confirm(
            'Delete "' +
            project.name +
            '"?'
        );


    if (!confirmed) {

        return;

    }


    projects.splice(
        index,
        1
    );


    saveProjects();

    renderProjects();


    alert(
        "Project deleted successfully!"
    );

}


/* ================= CLOSE ================= */

function closeModal() {

    document.getElementById(
        "projectModal"
    )
    .classList
    .remove("show");

}


/* ================= NO LINK ================= */

function noLink(event) {

    event.preventDefault();

    alert(
        "No project link has been added yet."
    );

}


/* ================= ESCAPE ================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value;

    return div.innerHTML;

}


function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* ================= LOGOUT ================= */

function logout() {

    sessionStorage.removeItem(
        "currentRole"
    );

    sessionStorage.removeItem(
        "currentUser"
    );

}


/* ================= INITIAL LOAD ================= */

renderProjects();

</script>
